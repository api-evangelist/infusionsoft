note: 'Keap runs a real free sandbox tenant programme rather than a test-mode key prefix. There is no
  separate sandbox HOST and no test/live key prefix pair: a sandbox application is a normal Keap tenant
  with restricted capacity, reached over the same api.infusionsoft.com / api.keap.com base URLs with credentials
  issued for that tenant. That means an integration cannot tell test from live from the token or the URL
  - it is distinguished only by which application instance the credentials belong to.'
