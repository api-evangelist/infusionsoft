  a Google-style Error object. Keap publishes no error-code registry: the 4xx/5xx set is declared uniformly
  on every operation with only the HTTP reason phrase as the description, so the catalogue below is the
  complete published error semantics. 429 is documented in the quota guide but is declared on ZERO operations
  in either spec, which is the single largest gap between the docs and the contract.'
