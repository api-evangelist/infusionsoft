note: 'Contact is the hub of the Keap model - opportunities, orders, subscriptions, notes, tasks, emails
  and deals all hang off it, and tags are the many-to-many labelling layer over contacts and companies.
  The most important structural fact for an integrator is that EVERY major entity carries a per-tenant
  custom-field model: Contact, Company, Order, Opportunity and Subscription each expose /model plus customFields,
  customFields/tabs and customFields/groups sub-resources. Custom field ids are not portable between Keap
  application instances, so an agent must read the model endpoint before writing custom data. Ids are
  plain integers/strings with no type prefix, so an id carries no information about which entity it belongs
  to.'
