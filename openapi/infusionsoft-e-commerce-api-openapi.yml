    post:
      tags:
      - E-Commerce
      summary: Create an Order
      description: Create a one time order with order items.
      operationId: createOrderUsingPOST
      requestBody:
        description: createOrder
        content:
          application/json:
            schema:
              title: CreateOrder
              required:
              - contact_id
              - order_date
              - order_items
              - order_title
              - order_type
              type: object
              properties:
                contact_id:
                  type: integer
                  format: int64
                lead_affiliate_id:
                  type: integer
                  format: int64
                order_date:
                  type: string
                  format: date-time
                order_items:
                  type: array
                  items:
                    title: CreateOrderItem
                    required:
                    - product_id
                    - quantity
                    type: object
                    properties:
                      description:
                        type: string
                      item_type:
                        type: string
                        enum:
                        - UNKNOWN
                        - SHIPPING
                        - TAX
                        - SERVICE
                        - PRODUCT
                        - UPSELL
                        - FINANCE_CHARGE
                        - SPECIAL
                        - PROGRAM
                        - SUBSCRIPTION
                        - SPECIAL_FREE_TRIAL_DAYS
                        - SPECIAL_ORDER_TOTAL
                        - SPECIAL_PRODUCT
                        - SPECIAL_CATEGORY
                        - SPECIAL_SHIPPING
                        - TIP
                        - OTHER
                      price:
                        type: string
                        description: Overridable price of the product, if not specified, the default will be used. Must be greater than or equal to 0.
                      product_id:
                        type: integer
                        description: The id of the product to be added to the order.
                        format: int64
                      quantity:
                        type: integer
                        description: Quantity must be greater than or equal to 1
                        format: int32
                order_title:
                  type: string
                order_type:
                  type: string
                  enum:
                  - Offline
                  - Online
                promo_codes:
                  type: array
                  description: Uses multiple strings as promo codes. The corresponding discount will be applied to the order.
                  items:
                    type: string
                sales_affiliate_id:
                  type: integer
                  format: int64
                shipping_address:
                  title: RestV1AddressInformation
                  type: object
                  properties:
                    company:
                      type: string
                    country_code:
                      type: string
                    first_name:
                      type: string
                    is_invoice_to_company:
                      type: boolean
                    last_name:
                      type: string
                    line1:
                      type: string
                    line2:
                      type: string
                    locality:
                      type: string
                    middle_name:
                      type: string
                    phone:
                      type: string
                    region:
                      type: string
                    zip_code:
                      type: string
                    zip_four:
                      type: string
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                title: Order
                type: object
                properties:
                  contact:
                    title: EcommerceReportingOrderContactDetails
                    type: object
                    properties:
