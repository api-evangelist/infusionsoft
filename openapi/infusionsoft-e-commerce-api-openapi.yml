components:
  schemas:
    CustomFieldOption:
      title: CustomFieldOption
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldOption'
    Throwable:
      title: Throwable
      type: object
      properties:
        cause:
          $ref: '#/components/schemas/Throwable'
        localizedMessage:
          type: string
        message:
          type: string
        stackTrace:
          type: array
          items:
            title: StackTraceElement
            type: object
            properties:
              classLoaderName:
                type: string
              className:
                type: string
              fileName:
                type: string
              lineNumber:
                type: integer
                format: int32
              methodName:
                type: string
              moduleName:
                type: string
              moduleVersion:
                type: string
              nativeMethod:
                type: boolean
        suppressed:
          type: array
          items:
            $ref: '#/components/schemas/Throwable'
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
        total:
          type: number
          format: double
        contact:
          $ref: '#/components/schemas/EcommerceReportingOrderContactDetails'
        notes:
          type: string
        creation_date:
          type: string
        modification_date:
          type: string
        order_date:
          type: string
        lead_affiliate_id:
          type: integer
          format: int64
        sales_affiliate_id:
          type: integer
          format: int64
        total_due:
          type: number
          format: double
        total_paid:
          type: number
          format: double
        shipping_information:
          $ref: '#/components/schemas/RestV1AddressInformation'
        refund_total:
          type: number
          format: double
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        payment_plan:
          $ref: '#/components/schemas/RestPaymentPlan'
    OrderItemTax:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderItemId:
          type: integer
          format: int64
        name:
          type: string
        rate:
          type: number
          format: double
        taxTemplateId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
    CustomFieldOption_2:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
    TransactionSearchCommand:
      type: object
      properties:
        since:
          type: string
        until:
          type: string
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        contact_id:
          type: integer
          format: int64
        sinceAsDate:
          type: string
          format: date-time
        untilAsDate:
          type: string
          format: date-time
    View:
      type: object
      properties:
        contentType:
          type: string
    SubscriptionList:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        count:
          type: integer
          format: int32
        next:
          type: string
        previous:
          type: string
    CreatePayment:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Used when charge_now:false or inserting historical data. ex `2017-01-01T22:17:59.039Z`
        notes:
          type: string
        apply_to_commissions:
          type: boolean
        charge_now:
          type: boolean
        credit_card_id:
          type: integer
          format: int64
        payment_amount:
          type: string
        payment_method_type:
          type: string
          enum:
          - CREDIT_CARD
          - CASH
          - CHECK
          - TOKEN
        payment_gateway_id:
          type: string
    Product_:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        url:
          type: string
        status:
          type: integer
          format: int32
        product_name:
          type: string
        product_desc:
          type: string
        product_price:
          type: number
          format: double
        product_short_desc:
          type: string
        subscription_only:
          type: boolean
        product_options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
        subscription_plans:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPlan_'
    SubscriptionListCommand:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        contact_id:
          type: integer
          format: int64
    EcommerceReportingPaymentPlan:
      type: object
      properties:
        auto_charge:
          type: boolean
        credit_card_id:
          type: integer
          format: int64
        days_between_payments:
          type: integer
          format: int64
        initial_payment_amount:
          type: number
          format: double
        initial_payment_percent:
          type: number
          format: double
        initial_payment_date:
          type: string
        number_of_payments:
          type: integer
          format: int64
        payment_gateway:
          $ref: '#/components/schemas/EcommerceReportingPaymentGateway'
        plan_start_date:
          type: string
        payment_method_id:
          type: string
        max_charge_attempts:
          type: integer
          format: int64
        days_between_retries:
          type: integer
          format: int64
    ProductOption:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        label:
          type: string
        required:
          type: boolean
        type:
          type: string
          enum:
          - FixedList
          - Variable
        values:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionValue'
        min_chars:
          type: integer
          format: int32
        max_chars:
          type: integer
          format: int32
        allow_spaces:
          type: boolean
        can_end_with_character:
          type: boolean
        can_end_with_number:
          type: boolean
        can_contain_character:
          type: boolean
        can_contain_number:
          type: boolean
        can_start_with_character:
          type: boolean
        can_start_with_number:
          type: boolean
        text_message:
          type: string
        display_index:
          type: integer
          format: int32
    CreateOrder:
      type: object
      properties:
        contact_id:
          type: integer
          format: int64
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        order_title:
          type: string
        order_date:
          type: string
          format: date-time
        order_type:
          type: string
          enum:
          - Offline
          - Online
        promo_codes:
          type: array
          description: Uses multiple strings as promo codes. The corresponding discount will be applied to the order.
          items:
            type: string
        lead_affiliate_id:
          type: integer
          format: int64
        sales_affiliate_id:
          type: integer
          format: int64
        shipping_address:
          $ref: '#/components/schemas/RestV1AddressInformation'
      required:
      - contact_id
      - order_date
      - order_items
      - order_title
      - order_type
    EcommerceReportingPaymentGateway:
      type: object
      properties:
        merchant_account_id:
          type: integer
          format: int64
        use_default:
          type: boolean
        merchant_account_name:
          type: string
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
        notes:
          type: string
        quantity:
          type: integer
          format: int32
        cost:
          type: number
          format: double
        price:
          type: number
          format: double
        discount:
          type: number
          format: double
        product:
          $ref: '#/components/schemas/Product_'
        specialId:
          type: integer
          format: int64
        specialAmount:
          type: number
          format: double
        specialPctOrAmt:
          type: integer
          format: int32
        orderItemTaxes:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemTax'
        recurringBilling:
          type: boolean
        frequency:
          type: integer
          format: int32
        billingCycle:
          type: integer
          format: int32
        numberOfPayments:
          type: integer
          format: int32
        jobRecurringId:
          type: integer
          format: int64
        recurringStartDate:
          type: string
        recurringNextBillDate:
          type: string
        recurringEndDate:
          type: string
        recurringCyclesCompleted:
          type: integer
          format: int32
        recurringInactive:
          type: boolean
    CustomFieldMetaData:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldOption_2'
        record_type:
          type: string
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
        field_type:
          type: string
          enum:
          - Currency
          - Date
          - DateTime
          - DayOfWeek
          - Drilldown
          - Email
          - Month
          - ListBox
          - Name
          - WholeNumber
          - DecimalNumber
          - Percent
          - PhoneNumber
          - Radio
          - Dropdown
          - SocialSecurityNumber
          - State
          - Text
          - TextArea
          - User
          - UserListBox
          - Website
          - Year
          - YesNo
        field_name:
          type: string
        default_value:
          type: string
    CreateSubscription:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          description: Must be greater than 0. Default is 1.
        contact_id:
          type: integer
          format: int64
        subscription_plan_id:
          type: integer
          format: int64
          description: Id of the product subscription.
        allow_duplicate:
          type: boolean
          description: If true, it will disable the check to see if there is already an identical subscription for the contact. Default is false.
        billing_amount:
          type: number
          format: double
          description: Must be 0 or greater. Default is the price in the product subscription.
        first_bill_date:
          type: string
          format: date
          description: The first day the subscription will bill, in EST. Must not be in the past. Default is today.
        auto_charge:
          type: boolean
          description: Defaults to true.
        credit_card_id:
