                          format: double
                        description:
                          type: string
                        discount:
                          type: number
                          format: double
                        frequency:
                          type: integer
                          format: int32
                        id:
                          type: integer
                          format: int64
                        jobRecurringId:
                          type: integer
                          format: int64
                        name:
                          type: string
                        notes:
                          type: string
                        numberOfPayments:
                          type: integer
                          format: int32
                        orderItemTaxes:
                          type: array
