  /v1/orders/{orderId}/items:
    post:
      tags:
      - E-Commerce
      summary: Create an Order Item
      description: Creates an order item on an existing order.
      operationId: createOrderItemsOnOrderUsingPOST
      parameters:
      - name: orderId
        in: path
        description: orderId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: createOrderItem
        content:
          application/json:
            schema:
              title: CreateOrderItem
              required:
              - product_id
              - quantity
              type: object
              properties:
                description:
                  type: string
                item_type:
                  type: string
                  enum:
                  - UNKNOWN
                  - SHIPPING
                  - TAX
                  - SERVICE
                  - PRODUCT
                  - UPSELL
                  - FINANCE_CHARGE
                  - SPECIAL
                  - PROGRAM
                  - SUBSCRIPTION
                  - SPECIAL_FREE_TRIAL_DAYS
                  - SPECIAL_ORDER_TOTAL
                  - SPECIAL_PRODUCT
                  - SPECIAL_CATEGORY
                  - SPECIAL_SHIPPING
                  - TIP
                  - OTHER
                price:
                  type: string
                  description: Overridable price of the product, if not specified, the default will be used. Must be greater than or equal to 0.
                product_id:
                  type: integer
                  description: The id of the product to be added to the order.
                  format: int64
                quantity:
                  type: integer
                  description: Quantity must be greater than or equal to 1
                  format: int32
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                title: OrderItem
                type: object
                properties:
                  billingCycle:
                    type: integer
                    format: int32
                  cost:
                    type: number
                    format: double
                  description:
                    type: string
                  discount:
                    type: number
                    format: double
                  frequency:
                    type: integer
                    format: int32
                  id:
                    type: integer
                    format: int64
                  jobRecurringId:
                    type: integer
                    format: int64
                  name:
                    type: string
                  notes:
                    type: string
                  numberOfPayments:
                    type: integer
                    format: int32
                  orderItemTaxes:
                    type: array
