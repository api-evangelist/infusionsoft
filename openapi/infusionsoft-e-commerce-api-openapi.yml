                      title: OrderItemTax
                      type: object
                      properties:
                        amount:
                          type: number
                          format: double
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        orderItemId:
                          type: integer
                          format: int64
                        rate:
                          type: number
                          format: double
                        taxTemplateId:
                          type: integer
                          format: int64
                  price:
                    type: number
                    format: double
                  product:
                    title: Product_
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      product_desc:
                        type: string
                      product_name:
                        type: string
                      product_options:
                        type: array
                        items:
                          title: ProductOption
                          type: object
                          properties:
                            allow_spaces:
                              type: boolean
                            can_contain_character:
