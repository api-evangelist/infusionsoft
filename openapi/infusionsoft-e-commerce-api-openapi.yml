                                format: int64
                              name:
                                type: string
                              orderItemId:
                                type: integer
                                format: int64
                              rate:
                                type: number
                                format: double
                              taxTemplateId:
                                type: integer
                                format: int64
                        price:
                          type: number
                          format: double
                        product:
