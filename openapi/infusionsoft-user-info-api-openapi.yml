          description: OK
          content:
            application/json:
              schema:
                title: UserInfoDTO
                required:
                - email
                - family_name
                - given_name
                - global_user_id
                - infusionsoft_id
                - sub
                type: object
                properties:
                  email:
                    type: string
                  family_name:
                    type: string
                  given_name:
                    type: string
                  global_user_id:
                    type: integer
                    format: int64
                  infusionsoft_id:
                    type: string
                  is_admin:
                    type: boolean
                  middle_name:
                    type: string
                  preferred_name:
                    type: string
                  sub:
