          description: The name of the custom field. This field is optional.
          nullable: true
        type:
          description: The type of the custom field. This field is optional and must
            be a valid PipelineCustomFieldType.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldType"
          - description: ""
        label:
          type: string
          description: The label of the custom field. This field is optional.
          nullable: true
        description:
          type: string
          description: The description of the custom field. This field is optional.
          nullable: true
        helper_text:
          type: string
          description: The helper text for the custom field. This field is optional
            and is serialized to JSON as "helper_text".
          nullable: true
        default_value:
          type: object
          description: The default value of the custom field. This field is optional
            and must be a valid Object.
          nullable: true
