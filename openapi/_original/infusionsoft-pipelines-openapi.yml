components:
  schemas:
    BaseListResponse_DealNote_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BaseListResponse_Deal_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BaseListResponse_PipelineCustomField_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BaseListResponse_PipelineDealWithStageName_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BaseListResponse_PipelineSummary_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BaseListResponse_Pipeline_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BaseListResponse_Stage_:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token for the next page of results.
      description: The list responses.
    BulkCreateDealNoteRequest:
      required:
      - body
      - created_by
      - deal_id
      type: object
      properties:
        body:
          maxLength: 5000
          minLength: 1
          type: string
          description: The body of the note. Must not be blank and must be between
            1 and 5000 characters.
        created_by:
          maxLength: 255
          minLength: 1
          type: string
          description: The creator of the note. Must not be blank and must be between
            1 and 255 characters.
        deal_id:
          minLength: 1
          type: string
          description: The ID of the deal to which the note is associated. Must not
            be blank.
      description: Request model for creating a deal note as part of a bulk operation.
    BulkCreateDealNoteResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the note.
        body:
          type: string
          description: The body content of the note.
        deal_id:
          type: string
          description: The ID of the deal associated with the note.
        created_by:
          type: string
          description: The ID of the user who created the note.
        created_time:
          type: string
          description: The timestamp when the note was created. Formatted as a string
            according to the pattern "yyyy-MM-dd'T'HH:mm:ss.SSSXXX".
          format: date-time
        modified_time:
          type: string
          description: The timestamp when the note was last modified. Formatted as
            a string according to the pattern "yyyy-MM-dd'T'HH:mm:ss.SSSXXX".
          format: date-time
        create_success:
          type: boolean
          description: Indicates whether the note was created successfully.
        error_message:
          type: string
          description: "If the note creation was not successful, this field contains\
            \ the error message."
      description: Response model for creating a deal note as part of a bulk operation.
    BulkCreateDealNotesRequest:
      required:
      - create_note_requests
      type: object
      properties:
        create_note_requests:
          maxItems: 1000
          minItems: 1
          type: array
          description: List of requests to create deal notes. Each request must not
            be null and must contain valid data.
          items:
            $ref: "#/components/schemas/BulkCreateDealNoteRequest"
      description: Request model for creating multiple deal notes in bulk.
    BulkCreateDealNotesResponse:
      type: object
      properties:
        create_note_responses:
          type: array
          description: List of responses for each deal note creation request. Each
            response contains details about the creation status and any associated
            error messages.
          items:
            $ref: "#/components/schemas/BulkCreateDealNoteResponse"
      description: Response model for creating multiple deal notes in bulk.
    CreateDealInBulkRequest:
      required:
      - contacts
      - external_system_id
      - name
      - owners
      - stage_id
      - status
      - task_ids
      - value
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: The name of the deal. This field is required and must have
            at least one character.
        value:
          description: The monetary value of the deal. This field is required and
            must be valid.
          allOf:
          - $ref: "#/components/schemas/Money"
        contacts:
          type: array
          description: The list of contacts associated with the deal. This field is
            required.
          items:
            $ref: "#/components/schemas/DealContact"
        stage_id:
          minLength: 1
          type: string
          description: The id of the stage tied to the deal. This field is required
            and must be valid.
        owners:
          type: array
          description: The list of owners of the deal. This field is required.
          items:
            $ref: "#/components/schemas/Owner"
        owner_id:
          type: string
          description: The ID of the owner of the deal. This field is optional.
          nullable: true
        task_ids:
          type: array
          description: The list of task IDs associated with the deal. This field is
            required.
          items:
            type: string
        status:
          type: string
          description: The status of the deal. This field is required.
        estimated_close_time:
          type: string
          description: The estimated close time of the deal. This field is optional.
          format: date-time
          nullable: true
        external_system_id:
          minLength: 1
          type: string
        custom_fields:
          type: object
          additionalProperties: true
          description: The custom fields associated with the deal. This field is optional.
          nullable: true
      description: Request model for creating one deal as part of a bulk creation.
    CreateDealInBulkResponse:
      type: object
      properties:
        deal_id:
          type: string
          nullable: true
        create_success:
          type: boolean
          nullable: true
        error_message:
          type: string
          nullable: true
      description: Response model for creating multiple deals in bulk.
    CreateDealNoteRequest:
      required:
      - body
      - created_by
      type: object
      properties:
        body:
          maxLength: 5000
          minLength: 1
          type: string
          description: The body of the note. Must not be blank and must be between
            1 and 5000 characters.
        created_by:
          maxLength: 255
          minLength: 1
          type: string
          description: The creator of the note. Must not be blank and must be between
            1 and 255 characters.
      description: Request model for creating a deal note.
    CreateDealRequest:
      required:
      - contacts
      - name
      - owners
      - stage_id
      - status
      - task_ids
      - value
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: The name of the deal. This field is required and must have
            at least one character.
        value:
          description: The monetary value of the deal. This field is required and
            must be valid.
          allOf:
          - $ref: "#/components/schemas/Money"
        contacts:
          type: array
          description: The list of contacts associated with the deal. This field is
            required.
          items:
            $ref: "#/components/schemas/DealContact"
        stage_id:
          minLength: 1
          type: string
          description: The ID of the stage tied to the deal. This field is required
            and must be valid.
        owners:
          type: array
          description: The list of owners of the deal. This field is required.
          items:
            $ref: "#/components/schemas/Owner"
        owner_id:
          type: string
          description: The ID of the owner of the deal. This field is optional.
          nullable: true
        task_ids:
          type: array
          description: The list of task IDs associated with the deal. This field is
            required.
          items:
            type: string
        status:
          type: string
          description: The status of the deal. This field is required.
        estimated_close_time:
          type: string
          description: The estimated close time of the deal. This field is optional.
          format: date-time
          nullable: true
        custom_fields:
          type: object
          additionalProperties: true
          description: The custom fields associated with the deal. This field is optional.
          nullable: true
      description: Request model for creating a deal.
    CreateDealsInBulkRequest:
      required:
      - create_deal_requests
      type: object
      properties:
        create_deal_requests:
          type: array
          description: The list of requests to create deals. This field is required.
          items:
            $ref: "#/components/schemas/CreateDealInBulkRequest"
      description: Request model for creating multiple deals in bulk.
    CreateDealsInBulkResponse:
      type: object
      properties:
        created_deals:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CreateDealInBulkResponse"
          description: |-
            Map of created deals.

            Keys: Each external_system_id specified in the CreateDealsInBulkRequest request.

            Values: The result of the corresponding request to create a deal.
      description: Response model for creating multiple deals in bulk.
    CreatePipelineCustomFieldRequest:
      required:
      - name
      type: object
      properties:
        name:
          minLength: 1
          pattern: "^[a-zA-Z]\\w*$"
          type: string
          description: The name of the custom field. This field is required.
        type:
          description: The type of the custom field. This field is optional.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldType"
          - description: ""
        label:
          type: string
          description: The label of the custom field. This field is optional.
          nullable: true
        description:
          type: string
          description: The description of the custom field. This field is optional.
          nullable: true
        example_value:
          type: object
          description: The default value of the custom field.
          nullable: true
        helper_text:
          type: string
          description: The helper text for the custom field. This field is optional
            and is serialized to JSON as "helper_text".
          nullable: true
        default_value:
          type: object
          description: The default value of the custom field. This field is optional.
          nullable: true
        display_options:
          description: The display options for the custom field. This field is optional.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldDisplayOptions"
          - description: ""
        options:
          description: The options for the custom field. This field is optional.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldOptions"
          - description: ""
        validators:
          type: array
          description: The list of validators for the custom field. This field is
            optional and must be a list of valid PipelineCustomFieldPropertyValidator.
          nullable: true
          items:
            $ref: "#/components/schemas/PipelineCustomFieldPropertyValidator"
      description: Class representing a request to create a custom field.
    CreatePipelineRequest:
      required:
      - name
      - stages
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: The name of the pipeline.
        stages:
          maxItems: 100
          minItems: 1
          type: array
          description: The stages of the pipeline.
          items:
            type: string
      description: Request for creating a pipeline.
    CreateStageRequest:
      required:
      - name
      - pipeline_id
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: The name of the stage.
        pipeline_id:
          minLength: 1
          type: string
          description: The ID of the pipeline to which the stage belongs.
      description: Request for creating a stage.
    DateExpression:
      required:
      - date_inferred
      - parse_end
      - parse_start
      - query
      - recurring
      - recurse_until
      - result
      - time_inferred
      type: object
      properties:
        query:
          type: string
        parse_start:
          type: integer
          description: Where in the expression this date exists (start)
          format: int32
        parse_end:
          type: integer
          description: Where in the expression this date exists
          format: int32
        date_inferred:
          type: boolean
          description: Whether the date portion of the results has been inferred (and
            can be ignored)
        time_inferred:
          type: boolean
          description: Whether the time portion of the results has been inferred (and
            can be ignored)
        result:
          allOf:
          - $ref: "#/components/schemas/LogicalDate"
          - description: ""
        recurring:
          type: boolean
          description: Whether the results are recurring
        recurse_until:
          description: "If recurring, when the recurrence ends"
          allOf:
          - $ref: "#/components/schemas/LogicalDate"
          - description: ""
        complete_match:
          type: boolean
          nullable: true
    DateExpressionResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DateExpression"
    Deal:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the model.
        name:
          type: string
          description: The name of the deal. This field is required and must have
            at least one character.
        value:
          description: The monetary value of the deal. This field is required and
            must be valid.
          allOf:
          - $ref: "#/components/schemas/Money"
        contact_ids:
          type: array
          description: The list of IDs of contacts associated with the deal. This
            field is required.
          items:
            type: string
        stage_id:
          type: string
          description: The stage of the deal. This field is required and must be valid.
        stage_assignment_time:
          type: string
          description: The time when the deal was assigned to the current stage. This
            field is required.
          format: date-time
        owner_ids:
          type: array
          description: The list of IDs of owners of the deal. This field is required.
          items:
            type: string
        task_ids:
          type: array
          description: The list of task IDs associated with the deal. This field is
            required.
          items:
            type: string
        order_id:
          type: string
          description: The order of the deal. This field is optional.
        status:
          type: string
          description: The status of the deal. This field is required.
        estimated_close_time:
          type: string
          description: The estimated close time of the deal. This field is optional.
          format: date-time
        closed_time:
          type: string
          description: The actual close time of the deal. This field is optional.
          format: date-time
        custom_fields:
          type: object
          additionalProperties: true
          description: The custom fields associated with the deal. This field is optional.
      description: Represents a deal.
    DealContact:
      required:
      - primary_contact
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the model.
        primary_contact:
          type: boolean
          description: Indicates if this contact is the primary contact. This field
            is required.
      description: Represents a contact entity in the system.
    DealCustomFieldsPropertyValidationResult:
      type: object
      properties:
        path:
          type: array
          items:
            type: object
        error_code:
          type: string
        message:
          type: string
        args:
          description: To trace this error in the logs
        logref:
          type: string
      description: Response model for validating a single custom field in a deal.
    DealCustomFieldsValidationRequest:
      required:
      - custom_fields
      type: object
      properties:
        custom_fields:
          minItems: 1
          type: object
          additionalProperties: true
      description: Request model for validating custom fields in deals.
    DealCustomFieldsValidationResponse:
      required:
