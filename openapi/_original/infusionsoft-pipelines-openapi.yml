      - GREATER_THAN_OR_EQUAL
      - LESS_THAN
      - LESS_THAN_OR_EQUAL
      - IN
      - NOT_IN
      - INCLUDES_ANY
      - EXCLUDES_ANY
      - BETWEEN
      - CONTAINS
