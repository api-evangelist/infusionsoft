    StageDealListResponse:
      type: object
      description: Response for a list of deals in a stage.
      allOf:
      - $ref: "#/components/schemas/BaseListResponse_Deal_"
      - properties:
          next_page_token:
            type: string
            description: Token for the next page of results.
          deals:
            type: array
            description: The list of deals in a stage.
            items:
              $ref: "#/components/schemas/Deal"
    StageListResponse:
      type: object
      description: Response for a list of stages.
      allOf:
      - $ref: "#/components/schemas/BaseListResponse_Stage_"
      - properties:
          next_page_token:
            type: string
            description: Token for the next page of results.
          stages:
            type: array
            description: The list of stages.
            items:
              $ref: "#/components/schemas/Stage"
    UpdateCustomFieldRequest:
      type: object
      properties:
        label:
          type: string
          description: The label of the custom field.
          nullable: true
        description:
          type: string
          description: The description of the custom field.
          nullable: true
        hint:
          type: string
          description: The hint for the custom field.
          nullable: true
        helper_text:
          type: string
          description: The helper text for the custom field.
          nullable: true
        default_value:
          type: object
          description: The default value of the custom field.
          nullable: true
        display_options:
          description: The display options for the custom field.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldDisplayOptions"
          - description: ""
        options:
          description: The options for the custom field.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldOptions"
          - description: ""
        validators:
          type: array
          description: The validators for the custom field.
          nullable: true
          items:
            $ref: "#/components/schemas/PipelineCustomFieldPropertyValidator"
        deleted:
          type: boolean
          description: Indicates whether the custom field is deleted.
          nullable: true
          deprecated: true
      description: Represents a request to update a custom field.
    UpdateDealNoteRequest:
      required:
      - body
      type: object
      properties:
        body:
          maxLength: 5000
          minLength: 1
          type: string
          description: The body of the note. Must not be blank and must be between
            1 and 5000 characters.
      description: Request model for updating a deal note.
    UpdateDealRequest:
      required:
      - stage_id
      - status
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
        amount:
          minimum: 0
          type: number
          format: double
        currency_code:
          minLength: 3
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/DealContact"
        stage_id:
          maxLength: 255
          minLength: 1
          type: string
        owners:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
        owner_id:
          type: string
        task_ids:
          type: array
          items:
            type: string
        previous_deal_id:
          maxLength: 255
          minLength: 1
          type: string
        next_deal_id:
          maxLength: 255
          minLength: 1
          type: string
        status:
          type: string
        estimated_close_date:
          type: string
          format: date-time
        closed_date:
          type: string
          format: date-time
        custom_fields:
          type: object
          additionalProperties: true
      description: Request model for updating a deal.
    UpdateDealsInBulkRequest:
      required:
      - bulk_deal_update_type
      - exclude_deal_ids_specified
      - filters
      - new_value
      type: object
      properties:
        bulk_deal_update_type:
          type: string
          description: ""
        new_value:
          type: string
          description: ""
        deal_ids:
          maxItems: 5000
          minItems: 0
          type: array
          items:
            type: string
        exclude_deal_ids_specified:
          type: boolean
          description: ""
        filters:
          type: array
          items:
            $ref: "#/components/schemas/FilterEntry"
      description: Request for updating the deals of a pipeline.
    UpdateDealsInBulkResponse:
      required:
      - stage_move_success
      type: object
      properties:
        stage_move_success:
          type: boolean
          description: Indicates whether the stage move was successful.
        error_message:
          type: string
          description: Error message if the stage move was not successful.
      description: Response for a bulk update for the reals in a pipeline.
    UpdateDisplayFormRequest:
      required:
      - groups
      type: object
      properties:
        groups:
          type: array
          description: Groups of properties to display on the form.
          items:
            $ref: "#/components/schemas/UpdateDisplayGroupRequest"
    UpdateDisplayGroupRequest:
      required:
      - properties
      - title
      type: object
      properties:
        sort_order:
          type: integer
          description: Determines the order for where this display group shows up
            on the form.
          format: int32
        title:
          type: string
          description: The title of the display group.
        description:
          type: string
          description: The description of the display group.
        properties:
          type: array
          description: A list of properties that will be displayed in this group.
          items:
            $ref: "#/components/schemas/UpdateDisplayPropertyRequest"
    UpdateDisplayPropertyRequest:
      required:
      - source
      type: object
      properties:
        sort_order:
          type: integer
          description: Determines the order for where this display property shows
            up on the group.
          format: int32
        id:
          type: string
          description: Identifies the custom field that is tied to this display property.
        source:
          description: Indicates whether this display property is a system or custom
            field.
          allOf:
          - $ref: "#/components/schemas/DisplayPropertySource"
        system_field_record:
          type: string
          description: "Represents the domain (e.g., pipeline, contact) that this\
            \ display property belongs to."
        system_field_id:
          type: string
          description: "Represents the identifier of the system field that is in that\
            \ displayProperty. The source of this field will depend on the domain\
            \ (e. g., \"dealName\" in pipelines)"
        label:
          type: string
          description: The label to display on this property to help users identify
            it
        description:
          type: string
          description: Documentation that explains the purpose of this property
        helper_text:
          type: string
          description: More detailed explanation of the property to be shown if a
            user requests more information about it
        default_value:
          description: The value of this property if a value is not explicitly provided
        display_options:
          description: Allowed values for this property
          allOf:
          - $ref: "#/components/schemas/PipelineCustomFieldDisplayOptions"
    UpdateOutcomeLabelsRequest:
      required:
      - outcome_labels
      type: object
      properties:
        outcome_labels:
          type: array
          description: List of outcome labels to be updated.
          items:
            $ref: "#/components/schemas/PipelineOutcomeLabel"
      description: Represents a request to update outcome labels for a pipeline.
    UpdatePipelineRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: The name of the pipeline.
      description: Request for updating a pipeline.
    UpdateStageRequest:
      required:
      - name
      - next_stage_id
      - pipeline_id
      - previous_stage_id
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: The name of the stage.
          nullable: true
        previous_stage_id:
          minLength: 1
          type: string
          description: The ID of the previous stage.
          nullable: true
        next_stage_id:
          minLength: 1
          type: string
          description: The ID of the next stage.
          nullable: true
        pipeline_id:
          minLength: 1
          type: string
          description: The ID of the pipeline.
          nullable: true
      description: Request for updating a stage.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jwt
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.infusionsoft.com/app/oauth/authorize
          tokenUrl: https://api.infusionsoft.com/token
          scopes:
            api: General API access
