    post:
      tags:
      - Sales
      summary: Set default Merchant Account
      description: Sets the specified Merchant Account as the default Merchant Account.
      operationId: setMerchantGatewayAsDefault
      parameters:
      - name: id
        in: path
        required: true
        schema:
