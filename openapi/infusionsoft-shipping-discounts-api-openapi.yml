    UpdateShippingDiscountRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the discount
          example: Free Shipping Over $100
        description:
          type: string
          description: Description of the discount
          example: Free shipping on orders over $100
        criteria:
          type: array
          description: List of criteria that must be met for this discount to apply
          items:
            $ref: '#/components/schemas/UpdateShippingDiscountCriteria'
        discount_type:
          type: string
          description: 'Type of discount: AMOUNT (fixed amount) or PERCENT (percentage)'
          enum:
          - AMOUNT
          - PERCENT
          example: PERCENT
        discount_value:
          type: number
          format: double
          description: Value of the discount (amount or percentage depending on discount_type)
          example: 100
    ListShippingDiscountsResponse:
      type: object
      properties:
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/ShippingDiscount'
        next_page_token:
          type: string
    ShippingDiscount:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this shipping discount
          example: 105
        name:
          type: string
          description: Name of the discount
          example: Free Shipping Over $100
        description:
          type: string
          description: Description of the discount
          example: Free shipping on orders over $100
        criteria:
          type: array
          description: List of criteria that must be met for this discount to apply
          items:
            $ref: '#/components/schemas/DiscountCriteria'
        discount_type:
          type: string
          description: 'Type of discount: AMOUNT (fixed amount) or PERCENT (percentage)'
          enum:
          - AMOUNT
          - PERCENT
          example: PERCENT
        discount_value:
          type: number
          format: double
          description: Value of the discount (amount or percentage depending on discount_type)
          example: 100
    CreateShippingDiscountRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the discount
          example: Free Shipping Over $100
        description:
          type: string
          description: Description of the discount
          example: Free shipping on orders over $100
        criteria:
          type: array
          description: List of criteria that must be met for this discount to apply
          items:
            $ref: '#/components/schemas/CreateShippingDiscountCriteria'
        discount_type:
          type: string
          description: 'Type of discount: AMOUNT (fixed amount) or PERCENT (percentage)'
          enum:
          - AMOUNT
          - PERCENT
          example: PERCENT
        discount_value:
          type: number
          format: double
          description: Value of the discount (amount or percentage depending on discount_type)
          example: 100
      required:
      - discount_type
      - discount_value
      - name
    UpdateShippingDiscountCriteria:
      type: object
      properties:
        code:
          type: string
          description: Promotional code for PROMO_CODE criteria
          example: SUMMER2024
        criteria_id:
          type: string
          description: Unique identifier for this criteria
          example: 501
        range_start_time:
          type: string
          format: date-time
          description: Start date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-01-01T00:00:00Z'
        range_end_time:
          type: string
          format: date-time
          description: End date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-12-31T23:59:59Z'
        product_id:
          type: string
          description: Product ID for PRODUCT criteria
          example: 456
        product_quantity_min:
          type: integer
          format: int32
          description: Minimum product quantity for PRODUCT criteria
          example: 1
        product_quantity_max:
          type: integer
          format: int32
          description: Maximum product quantity for PRODUCT criteria
          example: 10
        plan_id:
          type: string
          description: Subscription plan ID for SUBSCRIPTION_PLAN criteria
          example: 789
        subscription_quantity:
          type: integer
          format: int32
          description: Subscription quantity for SUBSCRIPTION_PLAN criteria
          example: 1
        total_amount:
          type: number
          format: double
          description: Total amount threshold for ORDER_TOTAL criteria
          example: 100
        operator:
          type: string
          description: 'Comparison operator for ORDER_TOTAL criteria: LESS_THAN or GREATER_THAN'
          enum:
          - LESS_THAN
          - GREATER_THAN
          example: GREATER_THAN
      required:
      - criteria_id
    DiscountCriteria:
      type: object
      properties:
        type:
          type: string
          description: 'Type of criteria: DATE_RANGE, PROMO_CODE, PRODUCT, SUBSCRIPTION_PLAN, or ORDER_TOTAL'
          enum:
          - DATE_RANGE
          - PROMO_CODE
          - PRODUCT
          - SUBSCRIPTION_PLAN
          - ORDER_TOTAL
          example: DATE_RANGE
        code:
          type: string
