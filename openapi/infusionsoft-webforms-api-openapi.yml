components:
  schemas:
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    Webform:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for this webform
          example: 42
        xid:
          type: string
          description: The public unique identifier for this webform, used in webform URLs
          example: a1b2c3d4e5
        name:
          type: string
          description: The name of this webform
          example: Newsletter Signup Form
        funnel_id:
          type: string
          description: The id of the funnel this webform belongs to, if any
          example: 15
        custom_slug:
          type: string
          description: The custom slug of the webform. Used in pretty webform URLs
          example: newsletter-signup
        webform_url:
          type: string
          description: The URL for this webform that uses the xid to identify it
          example: https://thryv.com/app/form/a1b2c3d4e5
        pretty_webform_url:
          type: string
          description: The URL for this webform that uses the custom slug to identify it
          example: https://thryv.com/app/form/newsletter-signup
        thank_you_page_url:
          type: string
          description: The URL of the thank you page for this webform
          example: https://thryv.com/thank-you
        duplicate_check_option:
          type: string
          description: The option that determines if the lead submitted through the form is a duplicate or not. If it's a duplicate, then the lead will be merged with the existing contact record
          enum:
          - EMAIL
          - EMAIL_AND_NAME
          - EMAIL_AND_NAME_AND_COMPANY
          - NO_CHECK
          example: EMAIL
        exit_option:
          type: string
          description: The option that determines what happens after the form is submitted
          enum:
          - REDIRECT
          - FUNNEL_LINK
          - HOSTED
          - LANDING_PAGE
          - WEB_FORM
          - SURVEY
          - UPDATE
          - UPDATE_OPT_OUT
          - OPT_OUT
          - CONFIRM
          - MESSAGE
          - AUTHORING_MESSAGE
          - MANUAL
          - CLOSE
          - DISPLAY_TEXT_AND_BUTTON
          - ERROR
          - HOSTED_PAGE
          example: REDIRECT
        webform_type:
          type: string
          description: The type of webform this is
          enum:
          - LEGACY
          - STANDALONE
          - FUNNEL
          - LANDING_PAGE
          - SURVEY
          - INTERNAL
          - TWITTER
          - UNKNOWN
          example: STANDALONE
        create_time:
          type: string
          format: date-time
          description: When the webform was created
          example: '2024-01-15T10:30:00Z'
        update_time:
          type: string
          format: date-time
          description: When the webform was last updated
          example: '2024-06-20T14:45:00Z'
    ListWebformsResponse:
      type: object
      properties:
        webforms:
          type: array
          description: The webforms in the current page
          items:
            $ref: '#/components/schemas/Webform'
        next_page_token:
          type: string
    Throwable:
      title: Throwable
      type: object
      properties:
        cause:
          $ref: '#/components/schemas/Throwable'
        localizedMessage:
          type: string
        message:
          type: string
        stackTrace:
          type: array
          items:
            title: StackTraceElement
            type: object
            properties:
              classLoaderName:
                type: string
              className:
                type: string
              fileName:
                type: string
              lineNumber:
                type: integer
                format: int32
              methodName:
                type: string
              moduleName:
                type: string
              moduleVersion:
                type: string
              nativeMethod:
                type: boolean
        suppressed:
          type: array
          items:
            $ref: '#/components/schemas/Throwable'
