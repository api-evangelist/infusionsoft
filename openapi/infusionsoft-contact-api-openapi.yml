    patch:
      tags:
      - Contact
      summary: Update a Contact
      description: 'Updates a contact with only the values provided in the request.


        You may opt-in or mark a Contact as _Marketable_ by including the following field in the request JSON with an opt-in reason. (This field is also shown in the complete request body sample.) The reason you provide here will help with compliance. Example reasons: "Customer opted-in through webform", "Contact gave explicit permission."


        ```json

        "opt_in_reason": "your reason for opt-in"

        ```

        Note that the email address status will only be updated to unconfirmed (marketable) for email addresses that are currently in the following states:

        Unengaged Marketable

        Unengaged Non-Marketable

        Non-Marketable

        Opt-Out: Manual

        All other existing statuses e.g. List Unsubscribe, Opt-Out System etc will remain non-marketable and in their existing state.'
      operationId: updatePropertiesOnContactUsingPATCH
      parameters:
      - name: contactId
        in: path
        description: contactId
        required: true
        schema:
          type: integer
          format: int64
      - name: update_mask
        in: query
        description: An optional list of properties to be updated. If set, only the provided properties will be updated and others will be skipped.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          enum:
          - addresses
          - anniversary
          - birthday
          - company
          - contact_type
          - custom_fields
          - email_addresses
          - family_name
          - fax_numbers
          - given_name
          - job_title
          - lead_source_id
          - middle_name
          - notes
          - opt_in_reason
          - origin
          - owner_id
          - phone_numbers
          - preferred_locale
          - preferred_name
          - prefix
          - social_accounts
          - source_type
          - spouse_name
          - suffix
          - time_zone
          - website
      requestBody:
        description: contact
        content:
          application/json:
            schema:
              title: CreateOrPatchContact
              type: object
              properties:
                addresses:
                  type: array
                  items:
                    title: ContactAddress
                    required:
                    - field
                    type: object
                    properties:
                      country_code:
                        type: string
                      field:
                        type: string
                        enum:
                        - BILLING
                        - SHIPPING
                        - OTHER
                      line1:
                        type: string
                      line2:
                        type: string
                      locality:
                        type: string
                      postal_code:
                        type: string
                        description: Field used to store postal codes containing a combination of letters and numbers ex. 'EC1A', 'S1 2HE', '75000'
                      region:
                        type: string
                      zip_code:
                        type: string
                        description: 'Mainly used in the United States, this is typically numeric. ex. ''85001'', ''90002'' Note: this is to be used instead of ''postal_code'', not in addition to.'
                      zip_four:
                        type: string
                        description: Last four of a full zip code ex. '8244', '4320'. This field is supplemental to the zip_code field, otherwise will be ignored.
                anniversary:
                  type: string
                  example: yyyy-MM-dd
                birthday:
                  type: string
                  format: date-time
                company:
                  title: RequestCompanyReference
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                contact_type:
                  type: string
                custom_fields:
                  type: array
                  items:
                    title: CustomFieldValue
                    type: object
                    properties:
                      content:
                        type: object
                      id:
                        type: integer
                        format: int64
                email_addresses:
                  type: array
                  items:
                    title: EmailAddress
                    required:
                    - field
                    type: object
                    properties:
                      email:
                        type: string
                      field:
                        type: string
                        enum:
                        - EMAIL1
                        - EMAIL2
                        - EMAIL3
                family_name:
                  type: string
                fax_numbers:
                  type: array
                  items:
                    title: FaxNumber
                    required:
                    - field
                    type: object
                    properties:
                      field:
                        type: string
                        enum:
                        - FAX1
                        - FAX2
                      number:
                        type: string
                      type:
                        type: string
                given_name:
                  type: string
                job_title:
                  type: string
                lead_source_id:
                  type: integer
                  format: int64
                middle_name:
                  type: string
                opt_in_reason:
                  type: string
                origin:
                  title: CreateContactOrigin
                  required:
                  - ip_address
                  type: object
                  properties:
                    ip_address:
                      type: string
                owner_id:
                  type: integer
                  format: int64
                phone_numbers:
                  type: array
                  items:
                    title: PhoneNumber
                    required:
                    - field
                    type: object
                    properties:
                      extension:
                        type: string
                      field:
                        type: string
                        enum:
                        - PHONE1
                        - PHONE2
                        - PHONE3
                        - PHONE4
                        - PHONE5
                      number:
