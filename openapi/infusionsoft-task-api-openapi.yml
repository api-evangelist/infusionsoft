          - '30'
          - '60'
          - '120'
          - '240'
          - '480'
          - '1440'
          - '2880'
          example: 30
        assigned_to_user_id:
          type: string
          description: Assigned user ID
          example: 456
        contact_id:
          type: string
          description: Associated contact ID
          example: 1001
        opportunity_id:
          type: string
          description: Associated opportunity ID
          example: 553
        accepted:
          type: boolean
          description: Whether the task has been accepted.
