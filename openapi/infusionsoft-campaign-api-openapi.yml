components:
  schemas:
    ListCampaignsResponse:
      type: object
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        next_page_token:
          type: string
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    RemoveContactsFromSequenceResponse:
      type: object
      properties:
        remove_from_sequence_results:
          type: object
          additionalProperties:
            type: string
            enum:
            - SUCCESS
            - CONTACT_DOES_NOT_EXIST
            - FAILED
          description: A map containing the contact ID as key and the result of removing them from the sequence as value
    SequencePath:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the sequence path
          example: 201
        items:
          type: array
          description: List of items in this sequence path
          items:
            $ref: '#/components/schemas/Item'
    ListCampaignGoalsResponse:
      type: object
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
        next_page_token:
          type: string
        campaign_id:
          type: string
    Campaign:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the campaign
          example: 123
        name:
          type: string
          description: The name of the campaign
          example: Summer Sale Campaign
        locked:
          type: boolean
          description: Whether the campaign is locked for editing
          example: false
        date_created:
          type: string
          format: date-time
          description: The date and time when the campaign was created. In ISO-8601 format
          example: '2024-05-21T14:30:00Z'
        published_date:
          type: string
          format: date-time
          description: The date and time when the campaign was published. In ISO-8601 format
          example: '2024-05-21T14:30:00Z'
        published_status:
          type: boolean
          description: Whether the campaign is published
          example: true
        error_message:
          type: string
          description: Error message if the campaign has issues
          example: Invalid sequence configuration
        time_zone:
          type: string
          description: The timezone of the campaign
          example: America/New_York
        published_time_zone:
          type: string
          description: The timezone used when the campaign was published
          example: America/New_York
        created_by_global_id:
          type: string
          description: The global ID of the user who created the campaign
          example: user_abc123
        active_contact_count:
          type: integer
          format: int32
          description: Number of contacts currently active in this campaign
          example: 250
        completed_contact_count:
          type: integer
          format: int32
          description: Number of contacts who have completed this campaign
          example: 1500
    ListCampaignSequenceResponse:
      type: object
      properties:
        sequences:
          type: array
          items:
            $ref: '#/components/schemas/Sequence'
        next_page_token:
          type: string
        campaign_id:
          type: string
    RemoveContactsFromSequenceRequest:
      type: object
      properties:
        contact_ids:
          type: array
          description: List of contact IDs to remove from the sequence
          example:
          - '123'
          - '456'
          - '789'
          items:
            type: string
      required:
      - contact_ids
    Sequence:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the sequence
          example: 456
        name:
          type: string
          description: The name of the sequence
          example: Welcome Series
        paths:
          type: array
          description: List of paths in this sequence
          items:
            $ref: '#/components/schemas/SequencePath'
        active_contact_count:
          type: integer
          format: int32
          description: Number of contacts currently in this sequence
          example: 75
        active_contact_count_completed:
          type: integer
          format: int32
          description: Number of contacts who have completed this sequence
          example: 500
        historical_contact_count:
          $ref: '#/components/schemas/HistoricalCounts'
          description: Historical contact counts for this sequence
    HistoricalCounts:
      type: object
      properties:
        24_hours:
          type: integer
          format: int32
          description: Number of contacts in the last 24 hours
          example: 50
        30_days:
          type: integer
          format: int32
          description: Number of contacts in the last 30 days
          example: 1200
    AddContactsToSequenceRequest:
      type: object
      properties:
        contact_ids:
          type: array
          description: List of contact IDs to add to the sequence
          example:
          - '123'
          - '456'
          - '789'
          items:
            type: string
      required:
      - contact_ids
    Goal:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the goal
          example: 789
        name:
          type: string
          description: The name of the goal
          example: Form Submission
        type:
          type: string
          description: The type of goal
          enum:
          - WebForm
          - LandingPage
          - Survey
          - LinkClick
          - EmailOpened
          - Score
          - Purchase
          - FailedPurchase
          - Quote
          - WebsiteTrigger
          - InternalForm
          - SmartForm
          - AppointmentEvent
          - Task
          - StageMove
          - Note
          - Tag
          - PipelineStageMove
          - UnlayerLandingPage
          - GroSocial
          - TwitterForm
          - API
          - WordPress
          - NewLandingPage
          - IntegrationTrigger
          example: WebForm
        historical_contact_counts:
          $ref: '#/components/schemas/HistoricalCounts'
          description: Historical contact counts for this goal
        next_sequence_ids:
          type: array
          description: IDs of sequences that follow this goal
          example:
          - '101'
          - '102'
          items:
            type: string
          uniqueItems: true
        previous_sequence_ids:
          type: array
          description: IDs of sequences that precede this goal
          example:
          - '99'
          - '100'
          items:
            type: string
          uniqueItems: true
    Item:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the item
          example: 101
        name:
          type: string
          description: The name of the item
          example: Send Welcome Email
        type:
          type: string
          description: The type of flow item
          enum:
          - Start
          - Wait
          - DelayTimer
          - ContactTimer
          - DateTimer
          - AppointmentTimer
          - Email
          - BardEmail
          - UnlayerEmail
          - EmailConfirm
          - Voice
          - Fax
          - Letter
          - AutomatedSms
          - UnlayerEmailConfirm
          - Tag
          - Opportunity
          - Note
          - Task
          - CompleteTasks
          - Appointment
          - AssignOwner
          - FieldValue
          - Fulfillment
          - CreateOrder
          - Deal
          - AddToSequence
          - CancelSubscription
          - MoveOpportunity
          - Http
          - CustomerHub
          - HttpRequest
          - IntegrationAction
          - ActionSet
          example: Email
        next_item_id:
          type: string
          description: The ID of the next item in the sequence
          example: 102
        previous_item_id:
          type: string
          description: The ID of the previous item in the sequence
          example: 100
    AddContactsToSequenceResponse:
      type: object
      properties:
        add_to_sequence_results:
          type: object
          additionalProperties:
            type: string
