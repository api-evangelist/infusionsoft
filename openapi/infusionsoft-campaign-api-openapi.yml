  /v1/campaigns:
    get:
      tags:
      - Campaign
      summary: List Campaigns
      description: Retrieves all campaigns for the authenticated user
      operationId: listCampaignsUsingGET
      parameters:
      - name: limit
        in: query
        description: Sets a total of items to return
        schema:
          type: integer
          format: int32
        example: 0
      - name: offset
        in: query
        description: Sets a beginning range of items to return
        schema:
          type: integer
          format: int32
        example: 0
      - name: order
        in: query
        description: Attribute to order items by
        schema:
          type: string
          enum:
          - id
          - name
          - published_date
          - completed_contact_count
          - active_contact_count
          - date_created
          - last_updated
          - category
          - status
      - name: order_direction
        in: query
        description: How to order the data i.e. ascending (A-Z) or descending (Z-A)
        schema:
          type: string
          enum:
          - ASCENDING
          - DESCENDING
      - name: search_text
        in: query
        description: Optional text to search
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: CampaignList
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      title: Campaign
                      type: object
                      properties:
                        created_by_global_id:
                          type: integer
                          format: int64
                        date_created:
                          type: string
                          format: date-time
                        error_message:
                          type: string
                        goals:
                          type: array
                          items:
                            title: Goal
                            type: object
                            properties:
                              historical_contact_counts:
                                title: HistoricalCounts
                                type: object
                                properties:
                                  24_hours:
                                    type: integer
                                    format: int32
                                  30_days:
                                    type: integer
                                    format: int32
                              id:
                                type: integer
                                format: int64
                              name:
                                type: string
                              next_sequence_ids:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                              previous_sequence_ids:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                              type:
                                type: string
                                enum:
                                - WebForm
                                - LandingPage
                                - Survey
                                - LinkClick
                                - EmailOpened
                                - Score
                                - Purchase
                                - FailedPurchase
                                - Quote
                                - WebsiteTrigger
                                - InternalForm
                                - SmartForm
                                - AppointmentEvent
                                - Task
                                - StageMove
                                - Note
                                - Tag
                                - PipelineStageMove
                                - UnlayerLandingPage
                                - GroSocial
                                - TwitterForm
                                - API
                                - WordPress
                                - NewLandingPage
                                - IntegrationTrigger
                        id:
                          type: integer
                          format: int64
                        locked:
                          type: boolean
                        name:
                          type: string
                        published_date:
                          type: string
                          format: date-time
                        published_status:
                          type: boolean
                        published_time_zone:
                          type: string
                        sequences:
                          type: array
                          items:
                            title: Sequence
                            type: object
                            properties:
                              active_contact_count:
                                type: integer
                                format: int32
                              active_contact_count_completed:
                                type: integer
                                format: int32
                              historical_contact_count:
                                title: HistoricalCounts
                                type: object
                                properties:
                                  24_hours:
                                    type: integer
                                    format: int32
                                  30_days:
                                    type: integer
                                    format: int32
                              id:
                                type: integer
                                format: int64
                              name:
                                type: string
                              paths:
                                type: array
                                items:
                                  title: SequencePath
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      format: int64
                                    items:
                                      type: array
                                      items:
                                        title: Item
                                        type: object
                                        properties:
                                          id:
                                            type: integer
                                            format: int64
                                          name:
                                            type: string
                                          next_item_id:
                                            type: integer
                                            format: int64
                                          previous_item_id:
                                            type: integer
                                            format: int64
                                          type:
                                            type: string
                                            enum:
                                            - 'NULL'
                                            - Start
                                            - Wait
                                            - DelayTimer
                                            - ContactTimer
                                            - DateTimer
                                            - AppointmentTimer
