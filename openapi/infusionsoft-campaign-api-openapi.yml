                                            - MoveOpportunity
                                            - Http
                                            - CustomerHub
                                            - HttpRequest
                                            - IntegrationAction
                                            - ActionSet
                        time_zone:
                          type: string
                  count:
                    type: integer
                    format: int32
                  next:
                    type: string
                  previous:
                    type: string
