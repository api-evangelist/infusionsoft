  /v1/emails:
    get:
      tags:
      - Email
      summary: List Emails
      description: 'Retrieve a list of emails that have been sent


        Keap is currently investigating an issue with degraded performance

        of this endpoint with very large (millions of records) record sets'
      operationId: listEmailsUsingGET
      parameters:
      - name: contact_id
        in: query
        description: Optional Contact Id to find Emails for
        schema:
          type: integer
          format: int64
        example: 0
      - name: email
        in: query
        description: Optional email address to query on
        schema:
          type: string
      - name: limit
        in: query
        description: Sets a total of items to return
        schema:
          type: integer
          format: int32
        example: 0
      - name: offset
        in: query
        description: Sets a beginning range of items to return
        schema:
          type: integer
          format: int32
        example: 0
      - name: ordered
        in: query
        description: Optional boolean to turn off ORDER BY in SQL query
        schema:
          type: boolean
          default: true
      - name: since_sent_date
        in: query
        description: Optional date to query on, emails sent since the provided date, must be present if untilDate is provided
        schema:
          type: string
      - name: until_sent_date
        in: query
        description: Optional date to query on, email sent until the provided date
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: EmailSentQueryResultList
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  emails:
                    type: array
                    items:
                      title: EmailSentQueryResult
                      type: object
                      properties:
                        clicked_date:
                          type: string
                          format: date-time
                        contact_id:
                          type: integer
                          format: int64
                        headers:
                          type: string
                        id:
                          type: integer
                          format: int64
                        opened_date:
                          type: string
                          format: date-time
                        original_provider:
                          type: string
                          enum:
                          - UNKNOWN
                          - INFUSIONSOFT
                          - MICROSOFT
                          - GOOGLE
                        original_provider_id:
                          type: string
                        received_date:
                          type: string
                          format: date-time
                        sent_date:
                          type: string
                          format: date-time
                        sent_from_address:
                          type: string
                        sent_from_reply_address:
                          type: string
                        sent_to_address:
                          type: string
                        sent_to_bcc_addresses:
                          type: string
                        sent_to_cc_addresses:
                          type: string
                        subject:
                          type: string
                  next:
                    type: string
                  previous:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: Error
                type: object
                properties:
                  cause:
                    title: Throwable
                    type: object
                    properties:
                      cause:
                        $ref: '#/components/schemas/Throwable'
                      localizedMessage:
                        type: string
                      message:
                        type: string
                      stackTrace:
                        type: array
                        items:
                          title: StackTraceElement
                          type: object
                          properties:
                            classLoaderName:
                              type: string
                            className:
                              type: string
                            fileName:
                              type: string
                            lineNumber:
                              type: integer
                              format: int32
                            methodName:
                              type: string
                            moduleName:
                              type: string
                            moduleVersion:
                              type: string
                            nativeMethod:
                              type: boolean
                      suppressed:
                        type: array
                        items:
                          $ref: '#/components/schemas/Throwable'
                  localizedMessage:
                    type: string
                  message:
                    type: string
                  stackTrace:
                    type: array
                    items:
                      title: StackTraceElement
                      type: object
                      properties:
                        classLoaderName:
                          type: string
                        className:
                          type: string
                        fileName:
                          type: string
                        lineNumber:
                          type: integer
                          format: int32
                        methodName:
                          type: string
                        moduleName:
                          type: string
                        moduleVersion:
                          type: string
                        nativeMethod:
                          type: boolean
                  suppressed:
                    type: array
                    items:
                      title: Throwable
                      type: object
                      properties:
                        cause:
                          $ref: '#/components/schemas/Throwable'
                        localizedMessage:
                          type: string
                        message:
                          type: string
                        stackTrace:
                          type: array
                          items:
                            title: StackTraceElement
                            type: object
                            properties:
                              classLoaderName:
                                type: string
                              className:
                                type: string
                              fileName:
                                type: string
                              lineNumber:
                                type: integer
                                format: int32
                              methodName:
                                type: string
                              moduleName:
                                type: string
                              moduleVersion:
                                type: string
                              nativeMethod:
                                type: boolean
                        suppressed:
                          type: array
                          items:
                            $ref: '#/components/schemas/Throwable'
        '403':
