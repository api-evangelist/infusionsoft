components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    EmailSendTemplateRequest:
      type: object
      description: 'Use a template to send an email to a list of contacts '
      properties:
        template_id:
          type: string
          description: Template ID
          example: 123
        contact_ids:
          type: array
          description: List of contact IDs to send the email to
          example:
          - '1'
          - '2'
          - '3'
          items:
            type: string
        user_id:
          type: string
          description: The user ID to send the email on behalf of
          example: 1
        address_field:
          type: string
          description: Email field of each Contact record to address the email to, such as 'Email', 'EmailAddress2', 'EmailAddress3' or '_CustomFieldName', defaulting to the contact's primary email
          example: EMAIL1
      required:
      - contact_ids
      - template_id
      - user_id
    ErrorDetails:
      type: object
      properties:
        domain:
          type: string
        resource:
          type: string
    EmailsSentList:
      type: object
      description: Response containing created emails and any errors
      properties:
        emails:
          type: array
          description: Successfully created email records
          items:
            $ref: '#/components/schemas/EmailSentWithContent'
        errors:
          type: array
          description: Errors that occurred during creation
          items:
            $ref: '#/components/schemas/EmailSentCreateError'
    EmailTemplate:
      type: object
      description: An email template
      properties:
        id:
          type: integer
          format: int64
          description: The id of the template
        piece_title:
          type: string
          description: The title of the template
          example: Welcome Email
        categories:
          type: array
          description: The categories associated with the email
          example:
          - Marketing
          - Onboarding
          items:
            type: string
        from_address:
          type: string
          description: The from address of the email
          example: ~Owner.Email~
        to_address:
          type: string
          description: The to address of the email
          example: ~Contact.Email~
        cc_address:
          type: string
          description: The cc address of the email
          example: manager@company.com
        bcc_address:
          type: string
          description: The bcc address of the email
          example: archive@company.com
        subject:
          type: string
          description: The subject of the email
          example: Welcome ~Contact.FirstName~!
        text_body:
          type: string
          description: The text body of the email
          example: Hello ~Contact.FirstName~, welcome!
        html_body:
          type: string
          description: The HTML body of the email
          example: <h1>Welcome ~Contact.FirstName~!</h1>
        content_type:
          type: string
          description: The content type of the email
          enum:
          - TEXT
          - HTML
          - MULTIPART
          example: HTML
        merge_context:
          type: string
          description: The merge context of the email
          example: Contact
    DeleteEmailsResponse:
      type: object
      description: Response from deleting email records
      properties:
        results:
          type: object
          additionalProperties:
            type: string
          description: Map of email ID to deletion result (SUCCESS, NO_PERMISSION, EMAIL_ID_NOT_FOUND)
    CreateEmailsSentRequest:
      type: object
      description: Email records to persist, with content.
      properties:
        emails:
          type: array
          description: Collection of email records to create, maximum 1000
          items:
            $ref: '#/components/schemas/CreateEmailSentRequest'
      required:
      - emails
    CreateEmailSentRequest:
      type: object
      description: Request to create an email record
      properties:
        subject:
          type: string
          description: The subject of the email
          example: Welcome to our service
        headers:
          type: string
          description: Email headers
          example: 'X-Custom-Header: value'
        contact_id:
          type: string
          description: The contact ID who received the email
          example: 456
        sent_to_address:
          type: string
          description: The email address the email was sent to
          example: john@example.com
        sent_to_cc_address_list:
          type: array
          description: List of CC email addresses
          example:
          - cc1@example.com
          - cc2@example.com
          items:
            type: string
        sent_to_bcc_address_list:
          type: array
          description: List of BCC email addresses
          example:
          - bcc@example.com
          items:
            type: string
        sent_from_address:
          type: string
          description: The sender's email address
          example: sender@company.com
        sent_from_reply_address:
          type: string
          description: The reply-to email address
          example: reply@company.com
        sent_time:
          type: string
          format: date-time
          description: When the email was sent, in ISO-8601 format. If omitted, the stored sent_time will be null.
          example: '2024-05-21T14:30:00Z'
        received_time:
          type: string
          format: date-time
          description: When the email was received, in ISO-8601 format
          example: '2024-05-21T14:31:00Z'
        opened_time:
          type: string
          format: date-time
          description: When the email was opened, in ISO-8601 format
          example: '2024-05-21T15:00:00Z'
        clicked_time:
          type: string
          format: date-time
          description: When a link in the email was clicked, in ISO-8601 format
          example: '2024-05-21T15:05:00Z'
        plain_content:
          type: string
          description: Base64 encoded text
          example: V2VsY29tZSB0byBvdXIgc2VydmljZQ==
        html_content:
          type: string
          description: Base64 encoded HTML
          example: PGgxPldlbGNvbWU8L2gxPg==
        original_provider:
          type: string
          description: Provider that sent the email, defaults to UNKNOWN
          enum:
          - UNKNOWN
          - INFUSIONSOFT
          - MICROSOFT
          - GOOGLE
          example: INFUSIONSOFT
        original_provider_id:
          type: string
          description: Provider id that sent the email, must be unique when combined with provider. If omitted a UUID without dashes is autogenerated for the record.
          example: msg_abc123
        provider_source_id:
          type: string
          description: The email address of the synced email account that generated this message.
          example: sync@company.com
      required:
      - sent_to_address
    EmailSentWithContent:
      type: object
      description: A sent email record with full content
      properties:
        id:
          type: string
          description: The unique identifier of the email
          example: 123
        subject:
          type: string
          description: The subject of the email
          example: Welcome to our service
        headers:
          type: string
          description: Email headers
          example: 'X-Custom-Header: value'
        contact_id:
          type: string
          description: The contact ID who received the email
          example: 456
        sent_to_address:
          type: string
          description: The email address the email was sent to
          example: john@example.com
