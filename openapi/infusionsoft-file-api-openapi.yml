    servers:
    - url: https://api.infusionsoft.com/crm/rest
  /v1/files/{fileId}:
    get:
      tags:
      - File
      summary: Retrieve File
      description: 'Retrieves metadata about a specific file. Optionally returns the base64 encoded file data.


        **Note:** Files larger than 8MB may cause errors when retrieved via the v1 API due to Base64 encoding overhead. For files approaching or exceeding this size, use the [v2 Files endpoint](https://developer.infusionsoft.com/docs/restv2/#tag/Files/operation/getFileDataUsingGET), which returns file data as byte arrays without encoding limitations.'
      operationId: getFileUsingGET
      parameters:
      - name: fileId
        in: path
        description: fileId
        required: true
        schema:
          type: integer
          format: int64
      - name: optional_properties
        in: query
        description: Comma-delimited list of File properties to include in the response. (Some fields such as `file_data` aren't included, by default.)
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FileInformation
                type: object
                properties:
                  file_data:
                    type: string
                  file_descriptor:
                    title: FileDescriptor
                    required:
                    - id
                    type: object
                    properties:
                      category:
                        type: string
                        enum:
                        - Attachments
                        - Cart
                        - Documents
                        - Hidden
                        - Invoice
                        - Logo
                        - Tickets
                        - WebForm
                        - Funnel
                      contact_id:
                        type: integer
                        format: int64
                      created_by:
                        type: integer
                        format: int64
                      date_created:
                        type: string
                        format: date-time
                      download_url:
                        type: string
                      file_box_type:
                        type: string
                        enum:
                        - Application
                        - Image
                        - Fax
                        - Attachment
                        - Ticket
                        - Contact
                        - DigitalProduct
                        - Import
                        - Hidden
                        - WebForm
                        - StyledCart
                        - ReSampledImage
                        - TemplateThumbnail
                        - Funnel
                        - LogoThumbnail
                        - Unlayer
                        - BrandingCenterLogo
                      file_name:
                        type: string
                      file_size:
                        type: integer
                        format: int64
                      id:
                        type: integer
                        format: int64
                      last_updated:
                        type: string
                        format: date-time
                      public:
                        type: boolean
                      remote_file_key:
                        type: string
        '401':
          description: Unauthorized
          content:
            application/json:
