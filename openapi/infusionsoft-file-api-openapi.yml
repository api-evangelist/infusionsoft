                          - Cart
                          - Documents
                          - Hidden
                          - Invoice
                          - Logo
                          - Tickets
                          - WebForm
                          - Funnel
                        contact_id:
                          type: integer
                          format: int64
                        created_by:
                          type: integer
                          format: int64
                        date_created:
                          type: string
                          format: date-time
                        download_url:
                          type: string
                        file_box_type:
