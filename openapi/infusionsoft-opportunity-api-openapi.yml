components:
  schemas:
    RestV2Opportunity:
      type: object
      properties:
        id:
          type: string
          description: Opportunity ID
          example: 123
        contact:
          $ref: '#/components/schemas/OpportunityContact'
        stage:
          $ref: '#/components/schemas/OpportunityStage'
        user:
          $ref: '#/components/schemas/RestV2User'
        opportunity_title:
          type: string
          description: Opportunity title
          example: New Business Deal
        next_action_time:
          type: string
          description: Next action timestamp (ISO-8601)
          example: '2024-03-20T10:00:00Z'
        next_action_notes:
          type: string
          description: Notes for next action
          example: Follow up with decision maker
        opportunity_notes:
          type: string
          description: General notes
          example: High-value prospect from trade show
        estimated_close_time:
          type: string
          description: Estimated close timestamp (ISO-8601)
          example: '2024-04-15T00:00:00Z'
        include_in_forecast:
          type: boolean
          description: Include in sales forecast
          example: true
        projected_revenue_low:
          type: number
          format: double
          description: Low revenue estimate
          example: 5000
        projected_revenue_high:
          type: number
          format: double
          description: High revenue estimate
          example: 10000
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
        created_time:
          type: string
          description: Creation timestamp (ISO-8601)
          example: '2024-01-10T08:00:00Z'
        last_updated_time:
          type: string
          description: Last update timestamp (ISO-8601)
          example: '2024-03-15T14:30:00Z'
        affiliate_id:
          type: string
          description: Affiliate ID
          example: 456
        lead_source:
          type: string
          description: Lead source
          example: Web Form
        monthly_revenue:
          type: number
          format: double
          description: Monthly recurring revenue
          example: 500
        order_revenue:
          type: number
          format: double
          description: Order revenue
          example: 2500
        objection:
          type: string
          description: Objection reason
          example: Price
        status:
          type: string
          description: Status name
          example: Active
        status_id:
          type: string
          description: Status ID
          example: 123
        stage_entrance_time:
          type: string
          description: Timestamp when the opportunity entered its current stage (ISO-8601)
          example: '2024-03-20T10:00:00Z'
        last_updated_by:
          type: string
          description: User who last updated the opportunity record
          example: 945
        created_by:
          type: string
          description: User who created the opportunity record
          example: 852
      required:
      - contact
      - opportunity_title
      - stage
    CustomField:
      type: object
      properties:
        content: {}
        id:
          type: string
    UpdateCustomFieldTabRequest:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
          format: int32
    OpportunityContact:
      type: object
      properties:
        id:
          type: string
          description: Contact ID
          example: 1001
        email:
          type: string
          description: Email address
          example: john.smith@example.com
        city:
          type: string
          description: City
          example: Chandler
        state:
          type: string
          description: State
          example: AZ
        first_name:
          type: string
          description: First name
          example: John
        last_name:
          type: string
          description: Last name
          example: Smith
        company_name:
          type: string
          description: Company name
          example: Acme Corp
        job_title:
          type: string
          description: Job title
          example: Sales Manager
        phone_number:
          type: string
          description: Phone number
          example: 5551234567
      required:
      - id
    CreateCustomFieldGroupRequest:
      type: object
      properties:
        name:
          type: string
        tab_id:
          type: string
    CustomFieldGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
          format: int32
        tab_id:
          type: string
        record_type:
          type: string
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
    OpportunityStage:
      type: object
      properties:
        id:
          type: string
          description: Stage ID
          example: 1
        name:
          type: string
          description: Stage name
          example: Qualified
        details:
          $ref: '#/components/schemas/StageDetails'
          description: Stage details
        reasons:
          type: array
          description: Stage change reasons
          items:
            type: string
      required:
      - id
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
          description: Checklist item ID
          example: 101
        description:
          type: string
          description: Item description
          example: Send proposal document
        required:
          type: boolean
          description: Whether item is required
          example: true
        order:
          type: integer
          format: int32
          description: Display order
          example: 1
    CustomFieldOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
    ListCustomFieldTabsResponse:
      type: object
      properties:
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldTab'
    UpdateOpportunityStageRequest:
      type: object
      properties:
        name:
          type: string
          example: Qualified
        order:
          type: integer
          format: int32
        probability:
          type: integer
          format: int32
          description: must be an integer between 0 and 100.
          example: 2
        target_number_days:
          type: integer
          format: int32
          description: Value should be >=0.
        checklist_items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateOpportunityStageChecklistItem'
    ListOpportunityStagesResponse:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: '#/components/schemas/RestOpportunityStage'
        next_page_token:
          type: string
    UpdateCustomFieldGroupRequest:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
          format: int32
        tab_id:
          type: string
    CustomFieldTab:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the custom field tab
          example: 123
        name:
          type: string
          description: The name of the custom field tab
          example: Personal Info
        order:
          type: integer
          format: int32
          description: The display order of the tab
          example: 1
        record_type:
          type: string
          description: The record type this tab belongs to (e.g., CONTACT, COMPANY, OPPORTUNITY, REFERRAL_PARTNER, ORDER, SUBSCRIPTION, TASK_NOTE_APPOINTMENT)
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
          example: CONTACT
    UpdateOpportunityStageChecklistItem:
      type: object
      properties:
        id:
          type: string
          description: Checklist item ID
          example: 101
        description:
          type: string
          description: Item description
          example: Review contract terms
        required:
          type: boolean
          description: Whether item is required
          example: true
        order:
          type: integer
          format: int32
          description: Display order position
          example: 1
      required:
      - description
      - order
      - required
    RestOpportunityStage:
      type: object
      properties:
        id:
          type: string
          description: Stage ID
          example: 1
        name:
          type: string
          description: Stage name
          example: Qualified
        order:
          type: integer
          format: int32
          description: Stage order in pipeline
          example: 2
        target_number_days:
          type: integer
          format: int32
          description: Target days in stage
          example: 14
        probability:
          type: integer
          format: int32
          description: Win probability (0-100)
          example: 50
        created_time:
          type: string
          description: Creation timestamp (ISO-8601)
          example: '2024-01-10T08:00:00Z'
        updated_time:
          type: string
          description: Last update timestamp (ISO-8601)
          example: '2024-03-15T10:30:00Z'
        checklist_items:
          type: array
          description: Stage checklist items
          items:
            $ref: '#/components/schemas/ChecklistItem'
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        status:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
    CustomFieldMetaData:
      type: object
      description: Metadata describing a custom field, including its type and options
      properties:
        id:
          type: string
          description: The unique identifier of the custom field
          example: 123
        label:
          type: string
          description: The display label of the custom field
          example: Favorite Color
        options:
          type: array
          description: The list of available options for select/radio/multiselect/drilldown field types
          items:
            $ref: '#/components/schemas/CustomFieldOption'
        record_type:
          type: string
          description: The entity type this custom field belongs to (e.g. CONTACT, COMPANY)
          enum:
          - CONTACT
          - REFERRAL_PARTNER
          - OPPORTUNITY
          - TASK_NOTE_APPOINTMENT
          - COMPANY
          - ORDER
          - SUBSCRIPTION
        field_type:
          type: string
          description: The data type of the custom field (e.g. Text, Number, Date, Select)
          enum:
          - CURRENCY
          - DATE
          - DATE_TIME
          - DAY_OF_WEEK
