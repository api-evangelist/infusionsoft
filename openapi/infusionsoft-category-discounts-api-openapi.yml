    CategoryDiscount:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this category discount
          example: 102
        name:
          type: string
          description: Name of the discount
          example: Electronics Category Sale
        description:
          type: string
          description: Description of the discount
          example: 15% off all electronics
        criteria:
          type: array
          description: List of criteria that must be met for this discount to apply
          items:
            $ref: '#/components/schemas/CategoryDiscountCriteriaResponse'
        discount_percent:
          type: number
          format: double
          description: Percentage discount to apply (0-100)
          example: 15
        apply_to_commissions:
          type: boolean
          description: Whether to apply this discount to commission calculations
          example: false
        product_categories:
          type: array
          description: List of product category IDs this discount applies to
          example:
          - '10'
          - '11'
          - '12'
          items:
            type: string
    ListCategoryDiscountsResponse:
      type: object
      properties:
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDiscount'
        next_page_token:
          type: string
    CategoryDiscountCriteriaRequest:
      type: object
      properties:
        type:
          type: string
          description: 'Type of criteria: DATE_RANGE or PROMO_CODE'
          enum:
          - DATE_RANGE
          - PROMO_CODE
          example: DATE_RANGE
        code:
          type: string
          description: Promotional code for PROMO_CODE criteria
          example: SUMMER2024
        range_start_time:
          type: string
          format: date-time
          description: Start date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-01-01T00:00:00Z'
        range_end_time:
          type: string
          format: date-time
          description: End date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-12-31T23:59:59Z'
    CreateCategoryDiscountCriteria:
      type: object
      properties:
        type:
          type: string
          description: 'Type of criteria: DATE_RANGE or PROMO_CODE'
          enum:
          - DATE_RANGE
          - PROMO_CODE
          example: DATE_RANGE
        code:
          type: string
          description: Promotional code for PROMO_CODE criteria
          example: SUMMER2024
        range_start_time:
          type: string
          format: date-time
          description: Start date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-01-01T00:00:00Z'
        range_end_time:
          type: string
          format: date-time
          description: End date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-12-31T23:59:59Z'
    CreateCategoryDiscountRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the discount
          example: Electronics Category Sale
        description:
          type: string
          description: Description of the discount
          example: 15% off all electronics
        criteria:
          type: array
          description: List of criteria that must be met for this discount to apply
          items:
            $ref: '#/components/schemas/CategoryDiscountCriteriaRequest'
        apply_to_commissions:
          type: boolean
          description: Whether to apply this discount to commission calculations
          example: false
        discount_percent:
          type: number
          format: double
          description: Percentage discount to apply. Must be greater than or equal to 0.
          example: 15
        product_category_ids:
          type: array
          description: List of product category IDs this discount applies to
          example:
          - '10'
          - '11'
          - '12'
          items:
            type: string
      required:
      - apply_to_commissions
      - discount_percent
      - name
      - product_category_ids
    DiscountCriteria:
      type: object
      properties:
        type:
          type: string
          description: 'Type of criteria: DATE_RANGE, PROMO_CODE, PRODUCT, SUBSCRIPTION_PLAN, or ORDER_TOTAL'
          enum:
          - DATE_RANGE
          - PROMO_CODE
          - PRODUCT
          - SUBSCRIPTION_PLAN
          - ORDER_TOTAL
          example: DATE_RANGE
        code:
          type: string
          description: Promotional code for PROMO_CODE criteria
          example: SUMMER2024
        criteria_id:
          type: string
          description: Unique identifier for this criteria
          example: 501
        range_start_time:
          type: string
          format: date-time
          description: Start date/time for DATE_RANGE criteria (ISO-8601 format)
          example: '2024-01-01T00:00:00Z'
