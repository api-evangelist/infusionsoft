  /v1/products/sync:
    get:
      tags:
      - Product
      summary: Retrieve Synced Products
      description: The Sync endpoint returns a set of products that have been updated or created since the last result set was retrieved, minus any products that have been deleted.
      operationId: listProductsFromSyncTokenUsingGET
      parameters:
      - name: limit
        in: query
        description: Sets a total of items to return
        schema:
          type: integer
          format: int32
        example: 0
      - name: offset
        in: query
        description: Sets a beginning range of items to return
        schema:
          type: integer
          format: int32
        example: 0
      - name: sync_token
        in: query
        description: sync_token
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ProductStatusList
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                  next:
                    type: string
                  previous:
                    type: string
                  product_statuses:
                    type: array
                    items:
                      title: ProductStatus
                      type: object
                      properties:
                        product:
                          title: Product_
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                            product_desc:
                              type: string
                            product_name:
                              type: string
                            product_options:
                              type: array
                              items:
                                title: ProductOption
                                type: object
                                properties:
                                  allow_spaces:
                                    type: boolean
                                  can_contain_character:
                                    type: boolean
                                  can_contain_number:
                                    type: boolean
                                  can_end_with_character:
                                    type: boolean
                                  can_end_with_number:
                                    type: boolean
                                  can_start_with_character:
                                    type: boolean
                                  can_start_with_number:
                                    type: boolean
                                  display_index:
                                    type: integer
                                    format: int32
                                  id:
                                    type: integer
                                    format: int64
                                  label:
                                    type: string
                                  max_chars:
                                    type: integer
                                    format: int32
                                  min_chars:
                                    type: integer
                                    format: int32
                                  name:
                                    type: string
                                  required:
                                    type: boolean
                                  text_message:
                                    type: string
                                  type:
