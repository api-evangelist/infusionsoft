  /v2/users:
    get:
      tags:
      - Users
      summary: List Users
      description: Retrieves a list of users
      operationId: listPaginatedUsersUsingGET
      parameters:
      - name: filter
        in: query
        description: 'Filter to apply, allowed fields are:

          - (String) `email`

          - (String) `given_name`

          - (Boolean) `include_inactive`

          - (Boolean) `include_partners`

          - (Set[String]) `user_ids`


          You will need to apply the `==` operator to check the equality of one of the filters with your searched

          word, in the encoded form `%3D%3D`.

          For the filters listed above, here are some examples:

          - `filter=given_name%3D%3DMary`

          - `filter=user_ids%3D%3D123%3Bgiven_name%3D%3DSmith`

          '
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `date_created`

          - `email`


          One of the following directions:

          - `asc`

          - `desc`'
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
        example: 10
      - name: page_token
        in: query
        description: Page token
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ListUsersPaginatedResponse
                type: object
                properties:
                  next_page_token:
                    type: string
                  users:
                    type: array
                    items:
                      title: User
                      type: object
                      properties:
                        address:
                          title: Address
                          type: object
                          properties:
                            country:
                              type: string
                              description: The long-name descriptive version of the Country Code
                              example: United States of America
                            country_code:
                              type: string
                              description: An ISO 3166-2 Country Code (https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)
                              example: USA
                            field:
                              type: string
                              enum:
                              - ADDRESS_FIELD_UNSPECIFIED
                              - BILLING
                              - SHIPPING
                              - OTHER
                            line1:
                              type: string
                            line2:
                              type: string
                            locality:
                              type: string
                              description: The municipality to which the address belongs
                              example: Phoenix
                            postal_code:
                              type: string
                            region:
                              type: string
                              description: The long-name descriptive version of the Region Code
                              example: Arizona
                            region_code:
                              type: string
                              description: An ISO 3166-2 Province Code, such as one of the US States (https://en.wikipedia.org/wiki/ISO_3166-2:US)
                              example: US-AZ
                            zip_code:
                              type: string
                            zip_four:
                              type: string
                        admin:
                          type: boolean
                        company_name:
                          type: string
                        create_time:
                          type: string
                        created_by:
                          type: integer
                          format: int64
                        email_addresses:
                          type: array
                          items:
                            title: EmailAddress
                            type: object
                            properties:
                              email:
                                type: string
                              email_opt_status:
                                type: string
                                enum:
                                - UNENGAGED_MARKETABLE
                                - SINGLE_OPT_IN
                                - DOUBLE_OPT_IN
                                - CONFIRMED
                                - UNENGAGED_NON_MARKETABLE
                                - NON_MARKETABLE
                                - LOCKDOWN
                                - BOUNCE
                                - HARD_BOUNCE
                                - MANUAL
                                - ADMIN
                                - SYSTEM
                                - LIST_UNSUBSCRIBE
                                - FEEDBACK
                                - SPAM
                                - INVALID
                                - DEACTIVATED
                              field:
                                type: string
                                enum:
                                - EMAIL_FIELD_UNSPECIFIED
                                - EMAIL1
                                - EMAIL2
                                - EMAIL3
                              is_opt_in:
                                type: boolean
                              opt_in_reason:
                                type: string
                        family_name:
                          type: string
                        fax_numbers:
                          type: array
                          items:
                            title: FaxNumber
                            type: object
                            properties:
                              field:
                                type: string
                                enum:
                                - FAX_NUMBER_FIELD_UNSPECIFIED
                                - FAX1
                                - FAX2
                              number:
                                type: string
                              type:
                                type: string
                        given_name:
                          type: string
                        global_user_id:
                          type: string
                        id:
                          type: string
                        keap_id:
                          type: string
                        partner:
                          type: boolean
                        phone_numbers:
                          type: array
                          items:
