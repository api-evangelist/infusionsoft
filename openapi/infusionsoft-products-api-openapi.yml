    patch:
      tags:
      - Products
      summary: Update a Product
      description: Updates a product
      operationId: updateProductUsingPATCH_1
      parameters:
      - name: product_id
        in: path
        description: product_id
        required: true
        schema:
          type: string
      - name: update_mask
        in: query
        description: An optional list of properties to be updated. If set, only the provided properties will be updated and others will be skipped.
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          enum:
          - active
          - name
          - description
          - price
          - sku
          - shippable
          - short_description
          - subscription_only
          - storefront_hidden
          - weight
          - taxable
          - country_taxable
          - city_taxable
          - state_taxable
          - inventory_limit
          - out_of_stock_enabled
          - email_for_inventory_notifications
      requestBody:
        description: updateProductRequest
        content:
          application/json:
            schema:
              title: UpdateProductRequest
              type: object
              properties:
                active:
                  type: boolean
                  description: True means active, False means inactive
                city_taxable:
                  type: boolean
                  description: If city-based taxes should be applied to this product
                country_taxable:
                  type: boolean
                  description: If country-based taxes should be applied to this product
                description:
                  type: string
                  description: Product long description
                email_for_inventory_notifications:
                  type: string
                  description: The email address for notifications about inventory
                inventory_limit:
                  type: integer
                  description: The inventory limit for this product. Must be greater than or equal to 0.
                  format: int32
                name:
                  type: string
                  description: Product name
                out_of_stock_enabled:
                  type: boolean
                  description: The flag to enable out of stock inventory
                price:
                  type: integer
                  description: The product price. The value is in the currency’s smallest unit. e.g. $12.50 is 1250. Must be greater than or equal to 0.
                  format: int64
                shippable:
                  type: boolean
                  description: If the product requires shipping
                short_description:
                  type: string
                  description: Product short description
                sku:
                  type: string
                  description: Product SKU
                state_taxable:
                  type: boolean
                  description: If state-based taxes should be applied to this product
                storefront_hidden:
                  type: boolean
                  description: If the product should not be shown in the storefront
                subscription_only:
                  type: boolean
                  description: If the product is a subscription-only product
                taxable:
                  type: boolean
                  description: Whether or not the product should be taxed
                weight:
                  type: number
                  description: The product weight. Must be greater than or equal to 0.
                  format: double
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: RestV2Product
                type: object
                properties:
                  active:
                    type: boolean
                    description: True means active, False means inactive
                  categories:
                    type: array
                    description: List of category ids to indicate which categories this product will belong to. Can be empty.
                    items:
                      type: string
                  city_taxable:
                    type: boolean
                    description: If city-based taxes should be applied to this product
                  country_taxable:
                    type: boolean
                    description: If country-based taxes should be applied to this product
                  description:
                    type: string
                    description: Product long description
                  id:
                    type: string
                    description: The product ID
                  inventory:
                    title: ProductInventory
                    type: object
                    properties:
                      email_for_inventory_notifications:
                        type: string
                        description: The email address for notifications about inventory
                      inventory_count:
                        type: integer
                        description: The current inventory count for this product. Must be greater than or equal to 0. This field is omitted in List responses.
                        format: int32
                      inventory_limit:
                        type: integer
                        description: The inventory limit for this product. Must be greater than or equal to 0.
                        format: int32
                      out_of_stock_enabled:
                        type: boolean
                        description: The flag to enable out of stock inventory
                  name:
                    type: string
                    description: Product name
                  options:
                    type: array
                    description: List of product options. Can be empty.
                    items:
                      title: ProductOptions
                      type: object
                      properties:
                        fixed_options:
                          type: array
                          description: List of option values for the fixed option
                          items:
                            title: ProductFixedOption
                            type: object
                            properties:
                              code:
                                type: string
                                description: An internal code to reference the option value
                              price_adjustment:
                                type: number
                                description: Positive value indicates additional amount added to the original price. Negative value indicates subtraction from the original price.
                                format: double
                              value:
                                type: string
                                description: The displayable label given to the option
                        name:
                          type: string
                          description: The option name
                        required:
                          type: boolean
                          description: If the user is required to select/fill in an option for the product
                        type:
                          type: string
                          description: Can be FIXED or VARIABLE. If FIXED, then fixed_options will be returned. If VARIABLE, then variable_setting will be returned.
                          enum:
                          - FIXED
                          - VARIABLE
                        variable_setting:
                          title: ProductVariableSetting
                          type: object
                          properties:
                            contain_spaces:
                              type: boolean
                              description: If spaces are allowed for the option
                            contains:
                              type: string
                              description: Requires the value (excluding start and end) to contain given type. Can be LETTER, NUMBER, or BOTH.
                            end_with:
                              type: string
                              description: Requires the value to end with the given type. Can be LETTER, NUMBER, or BOTH.
                            max_chars:
                              type: integer
                              description: Max allowable chars. Its value must be greater than min_chars
                              format: int32
                            min_chars:
                              type: integer
                              description: Minimum allowable characters
                              format: int32
                            start_with:
                              type: string
                              description: Requires the value to start with the given type. Can be LETTER, NUMBER, or BOTH.
                            validation_msg:
                              type: string
                              description: Customized validation message to display when option criteria aren’t met
                  price:
                    title: CurrencyValue
                    type: object
                    properties:
                      amount:
                        type: integer
                        description: The price amount in the smallest currency unit
                        format: int64
                      currency_code:
                        type: string
                        description: Three-letter ISO currency code
                      formatted_amount:
                        type: string
                        description: The product amount formatted using the tenant's currency locale
                  shippable:
                    type: boolean
                    description: If the product requires shipping
                  short_description:
                    type: string
                    description: Product short description
                  sku:
                    type: string
                    description: Product SKU
                  state_taxable:
                    type: boolean
                    description: If state-based taxes should be applied to this product
                  storefront_hidden:
                    type: boolean
                    description: If the product should not be shown in the storefront
                  subscription_only:
                    type: boolean
                    description: If the product is a subscription-only product
                  subscription_plans:
                    type: array
                    description: List of subscription plans associated with the product. Can be empty.
                    items:
                      title: SubscriptionPlan
                      type: object
                      properties:
                        active:
                          type: boolean
                          description: If the subscription plan is active or not.
                        allow_prorating:
                          type: boolean
                          description: Whether or not the plan will allow prorating.
                        cycle_type:
                          type: string
                          description: 'The cycle type of the subscription plan. Possible values: YEARLY, MONTHLY, WEEKLY, DAILY'
                          enum:
                          - DAILY
                          - WEEKLY
                          - MONTHLY
                          - YEARLY
                        display_order_index:
                          type: integer
                          description: The order index where this plan will be displayed on a page against other plans. Smaller number indicates plan will be displayed higher in the list.
                          format: int32
                        frequency:
                          type: integer
                          description: Total number of times of a cycle type which constitutes a plan cycle. Minimum value is 1.
                          format: int32
                        id:
                          type: string
                          description: Id of the subscription plan.
                        plan_price:
                          title: CurrencyValue
                          type: object
                          properties:
                            amount:
                              type: integer
                              description: The price amount in the smallest currency unit
                              format: int64
                            currency_code:
                              type: string
                              description: Three-letter ISO currency code
                            formatted_amount:
                              type: string
                              description: The product amount formatted using the tenant's currency locale
                        product_id:
                          type: string
                        total_cycles:
                          type: integer
                          description: Total number of cycles the plan will run before ending. Value of 0 indicates plan will never end.
                          format: int32
                  taxable:
                    type: boolean
                    description: Whether or not the product should be taxed
                  weight:
                    type: number
                    description: Product weight
                    format: double
