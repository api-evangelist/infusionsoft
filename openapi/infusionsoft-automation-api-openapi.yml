  /v2/automations:
    get:
      tags:
      - Automation
      summary: List Automations
      description: Retrieves a list of automations
      operationId: listAutomationsUsingGET
      parameters:
      - name: filter
        in: query
        description: 'Filter to apply, allowed fields are:

          - (String) `name`


          You will need to apply the `==` operator to check the equality of the filter with your searched

          text, in the encoded form `%3D%3D`. The search will look for the text anywhere in the automation name.


          - `filter=name%3D%3DSpring Automation`

          - `filter=name%3D%3DTag New Contacts`

          '
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Attribute and direction to order items.

          One of the following fields:

          - `name`

          - `category`

          - `activeContacts`

          - `publishedDate`


          One of the following directions:

          - `asc`

          - `desc`'
        schema:
          type: string
      - name: page_size
        in: query
        description: Total number of items to return per page
        schema:
          maximum: 25
          minimum: 1
          type: integer
          format: int32
        example: 0
      - name: page_token
        in: query
        description: Page token
        schema:
          type: string
      - name: stats
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ListAutomationResponse
                type: object
                properties:
                  automation_count:
                    type: integer
                    format: int32
                  automations:
                    type: array
                    items:
                      title: Automation
                      type: object
                      properties:
                        active_contacts:
                          type: integer
                          format: int32
                        categories:
                          type: array
                          items:
                            type: string
                        current_edit_lock_status:
                          title: AutomationLockStatus
                          type: object
                          properties:
                            locked:
                              type: boolean
                            user_firstname:
                              type: string
                            user_id:
                              type: string
                            user_name:
                              type: string
                        error_message:
                          type: string
                        id:
                          type: string
                        locked:
                          type: boolean
                        published_by:
                          type: string
                        published_date:
                          type: string
                        published_timezone:
                          type: string
                        status:
                          type: string
                        title:
                          type: string
                  next_page_token:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: Error
                type: object
                properties:
                  cause:
                    title: Throwable
                    type: object
                    properties:
                      cause:
                        $ref: '#/components/schemas/Throwable'
                      localizedMessage:
                        type: string
                      message:
                        type: string
                      stackTrace:
                        type: array
                        items:
                          title: StackTraceElement
                          type: object
                          properties:
                            classLoaderName:
                              type: string
                            className:
                              type: string
                            fileName:
                              type: string
                            lineNumber:
                              type: integer
                              format: int32
                            methodName:
                              type: string
                            moduleName:
                              type: string
                            moduleVersion:
                              type: string
                            nativeMethod:
                              type: boolean
                      suppressed:
                        type: array
                        items:
                          $ref: '#/components/schemas/Throwable'
