          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
    post:
      tags:
      - Files
      summary: Create a file
      description: Uploads a file using multipart/form-data. The `file` part contains the binary file content; `file_name`, `is_public`, `file_association`, and optionally `contact_id` are additional text parts in the same multipart request. Sending these as URL query parameters is not supported.
      operationId: createFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                file_name:
                  type: string
                  description: File name
                contact_id:
                  type: string
                  description: Contact ID. Required if the `file_association` is CONTACT
                is_public:
                  type: string
                  description: Is public
                file_association:
                  type: string
                  description: File association
              required:
              - file
              - file_association
              - file_name
      responses:
