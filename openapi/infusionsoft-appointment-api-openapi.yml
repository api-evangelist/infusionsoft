                          type: integer
                          format: int64
                        label:
                          type: string
                        options:
                          type: array
                          items:
                            title: CustomFieldOption
                            type: object
                            properties:
                              id:
                                type: string
                              label:
                                type: string
                              options:
                                type: array
                                items:
