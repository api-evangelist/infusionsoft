      summary: Retrieve Appointment Model
      description: Get the custom fields for the Appointment object
      operationId: retrieveAppointmentModelUsingGET
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ObjectModel
                type: object
                properties:
                  custom_fields:
                    type: array
