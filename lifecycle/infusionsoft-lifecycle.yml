note: 'Keap runs three concurrent API generations and labels their status in the developer guide, but
  publishes no dated deprecation policy, no sunset schedule, and no Deprecation/Sunset response headers
  (RFC 8594). XML-RPC is marked Deprecated with no stated end-of-life date, which is the weakest form
  of a deprecation signal: consumers are told the surface is going away but not when. The status page
  is Thryv-branded because Thryv Holdings acquired Keap; Keap components are listed on it.'
