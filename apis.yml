aid: infusionsoft
name: Infusionsoft (Keap)
description: >-
  Infusionsoft, now branded as Keap and owned by Thryv Holdings, is a sales and
  marketing automation CRM built for small businesses that combines contact
  management, tagging, email marketing, campaign and automation sequences,
  e-commerce orders and subscriptions, sales pipelines, appointments and
  invoicing in a single platform. Keap publishes three machine-readable REST
  contracts: a 399-operation OpenAPI 3.1 for REST v2, a 141-operation OpenAPI
  3.1 for REST v1, and a separate 45-operation Pipelines (deals) API, alongside
  a deprecated XML-RPC surface. Everything authenticates as a bearer token,
  either an OAuth 2.0 authorization-code token or a Personal Access Token or
  Service Account Key. Keap's event surface is REST Hooks and lives only on v1.
  There are no granular OAuth scopes and no idempotency keys anywhere in the
  API.
type: Index
