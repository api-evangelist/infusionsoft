aid: infusionsoft
name: Infusionsoft (Keap)
description: >-
  Infusionsoft, now branded as Keap, is a sales and marketing automation
  CRM built for small businesses that combines contact management,
  email marketing, e-commerce, pipeline automation, appointments, and
  invoicing in a single platform. Keap exposes REST APIs (v1 and v2)
  and a legacy XML-RPC API for managing contacts, companies,
  opportunities, orders, products, tags, emails, and campaigns, all
  authenticated via OAuth 2.0 authorization code and refresh token
  grants.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - CRM
  - Marketing Automation
  - Sales Automation
  - Email Marketing
  - E-Commerce
  - Small Business
url: >-
  https://raw.githubusercontent.com/api-evangelist/infusionsoft/refs/heads/main/apis.yml
created: '2026-05-11'
modified: '2026-05-11'
specificationVersion: '0.19'
apis:
  - aid: infusionsoft:rest-v2
    name: Keap REST API v2
    description: >-
      Modern REST API for managing contacts, companies, opportunities,
      tags, emails, appointments, notes, and tasks in Keap CRM.
      Authentication uses OAuth 2.0 with the authorization code and
      refresh token grants, with access tokens passed as Bearer tokens.
    humanURL: https://developer.infusionsoft.com/docs/restv2/
    baseURL: https://api.infusionsoft.com/crm/rest/v2
    tags:
      - CRM
      - Contacts
      - Opportunities
      - Tags
      - OAuth 2.0
    properties:
      - type: Documentation
        url: https://developer.infusionsoft.com/docs/restv2/
      - type: OAuth Guide
        url: https://developer.infusionsoft.com/getting-started-oauth-keys/
      - type: Authentication
        url: https://developer.infusionsoft.com/authentication/
  - aid: infusionsoft:rest-v1
    name: Keap REST API v1
    description: >-
      Original REST API for Keap (formerly Infusionsoft) covering
      contacts, orders, products, subscriptions, campaigns, files,
      tags, and merchants. Authentication uses OAuth 2.0 with Bearer
      access tokens.
    humanURL: https://developer.infusionsoft.com/docs/rest/
    baseURL: https://api.infusionsoft.com/crm/rest/v1
    tags:
      - CRM
      - Orders
      - Products
      - Campaigns
      - OAuth 2.0
    properties:
      - type: Documentation
        url: https://developer.infusionsoft.com/docs/rest/
      - type: OAuth Guide
        url: https://developer.infusionsoft.com/getting-started-oauth-keys/

