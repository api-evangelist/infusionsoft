apis:
  - aid: infusionsoft:rest-v2
    name: Keap REST API v2
    description: >-
      The default Keap REST API: 237 paths and 399 operations covering contacts,
      companies, tags, opportunities and stages, orders and order items,
      products, subscriptions and plans, notes, tasks, emails, automations,
      affiliates, lead sources, users and settings. Pages with opaque
      page_token cursors, filters with a filter expression parameter, and uses
      colon-suffixed custom verbs such as :merge, :applyTags and :achieve.
      Every major entity carries a per-tenant custom-field model. Authentication
      is a bearer token - OAuth 2.0 authorization code, a Personal Access Token,
      or a Service Account Key.
    humanURL: https://developer.keap.com/docs/restv2/
    baseURL: https://api.infusionsoft.com/crm/rest/v2
    tags:
      - CRM
      - Contacts
      - Opportunities
      - Orders
      - Subscriptions
      - Tags
      - OAuth 2.0
    properties:
      - type: OpenAPI
        url: openapi/infusionsoft-rest-v2-openapi.json
      - type: Overlay
        url: overlays/infusionsoft-rest-v2-overlay.yaml
      - type: Documentation
        url: https://developer.keap.com/docs/restv2/
      - type: APIReference
        url: https://developer.keap.com/docs/restv2/
      - type: OAuth Guide
        url: https://developer.keap.com/getting-started-oauth-keys/
      - type: Authentication
        url: https://developer.keap.com/authentication/
  - aid: infusionsoft:rest-v1
    name: Keap REST API v1
    description: >-
      The original Keap REST API, still labelled Current: 92 paths and 141
      operations covering contacts, companies, orders, products,
      subscriptions, campaigns, appointments, files, tags, notes, tasks,
      affiliates, merchants and account info - plus the REST Hooks
      subscription surface, which exists nowhere else in the Keap platform.
      Pages with offset and limit. A v2 integration still has to call v1 to
      manage its event subscriptions.
    humanURL: https://developer.keap.com/docs/rest/
    baseURL: https://api.infusionsoft.com/crm/rest/v1
    tags:
      - CRM
      - Orders
      - Products
      - Campaigns
      - REST Hooks
      - Webhooks
      - OAuth 2.0
    properties:
      - type: OpenAPI
        url: openapi/infusionsoft-rest-v1-openapi.json
      - type: Overlay
        url: overlays/infusionsoft-rest-v1-overlay.yaml
      - type: Webhooks
        url: asyncapi/infusionsoft-rest-hooks-webhooks.yml
      - type: Documentation
        url: https://developer.keap.com/docs/rest/
      - type: APIReference
        url: https://developer.keap.com/docs/rest/
      - type: OAuth Guide
        url: https://developer.keap.com/getting-started-oauth-keys/
  - aid: infusionsoft:pipelines
    name: Keap Pipelines API
    description: >-
      The Keap Pipelines (deals) API - 28 paths and 45 operations for deals,
      deal notes, deal custom fields, date expressions and bulk deal
      operations. Keap's own developer portal loads this as the Pipelines
      reference, and its servers block names api.infusionsoft.com, but the
      document is served from Thryv's API host because Thryv Holdings owns
      Keap. Its info.title is the internal service name SLAAPI (Service Level
      Aggregation API) and its contact address is gryffindor@keap.com. It
      declares no error responses at all - only 200, 201 and 204.
    humanURL: https://developer.keap.com/docs/restv2Pipelines/
    baseURL: https://api.infusionsoft.com
    tags:
      - CRM
      - Deals
      - Pipelines
      - Sales Automation
    properties:
      - type: OpenAPI
        url: openapi/infusionsoft-pipelines-openapi.yml
      - type: Overlay
        url: overlays/infusionsoft-pipelines-overlay.yaml
      - type: Documentation
        url: https://developer.keap.com/docs/restv2Pipelines/
      - type: APIReference
        url: https://developer.keap.com/docs/restv2Pipelines/
  - aid: infusionsoft:xml-rpc
    name: Infusionsoft XML-RPC API
    description: >-
      The legacy Infusionsoft XML-RPC API, explicitly labelled Deprecated in
      the Keap developer guide. It remains documented, with a published table
      schema reference, but Keap publishes no sunset date for it and no
      machine-readable contract exists for the surface.
    humanURL: https://developer.keap.com/docs/xml-rpc/
    baseURL: https://api.infusionsoft.com/crm/xmlrpc/v1
    tags:
      - CRM
      - XML-RPC
      - Deprecated
    properties:
      - type: Documentation
        url: https://developer.keap.com/docs/xml-rpc/
      - type: TableSchema
        url: https://developer.keap.com/docs/table-schema/

